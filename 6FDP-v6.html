function checkGate(){
  var input = document.getElementById('gateInput');
  var val = (input ? input.value : '').replace(/\s/g,'').toUpperCase();
  var err = document.getElementById('gateErr');
  if(ACCESS_CODES.indexOf(val) !== -1){
    try{ localStorage.setItem('6fdp-access', val); }catch(e){}
    hideGate();
    render();
  } else {
    if(err) err.textContent = 'Incorrect code. Check your purchase email.';
    if(input) input.style.borderColor = '#EF4444';
    setTimeout(function(){
      if(err) err.textContent = '';
      if(input) input.style.borderColor = '';
    }, 3000);
  }
}

function initGate(){
  var saved = '';
  try{ saved = localStorage.getItem('6fdp-access') || ''; }catch(e){}
  if((saved && ACCESS_CODES.indexOf(saved) !== -1) || _unlocked){
    hideGate();
  } else {

    if(go) go.style.display = 'flex';

}

// ── VIDEO PLAYER ───────────────────────────────────────
function openVideoPlayer(videoId, title){
  var modal = document.getElementById('videoModal');
  var frame = document.getElementById('videoModalFrame');
  var titleEl = document.getElementById('videoModalTitle');
  titleEl.textContent = title;
  // Use youtube-nocookie for better compatibility. Add onerror fallback.
  frame.innerHTML = `
    <iframe
      id="yt-iframe"
      src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen
      onload="checkIframeError(this,'${videoId}','${title.replace(/'/g,"\\'")}')"
    ></iframe>
    <div id="yt-fallback" style="display:none;position:absolute;inset:0;background:#111;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:32px;text-align:center;">
      <div style="font-size:40px;">▶</div>
      <p style="color:#fff;font-size:15px;font-weight:600;">${title}</p>
      <p style="color:rgba(255,255,255,0.6);font-size:13px;">This video can't be embedded but you can watch it directly on YouTube.</p>
      <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank"
        style="background:var(--gold);color:#fff;font-weight:700;font-size:14px;padding:13px 28px;border-radius:8px;text-decoration:none;display:inline-block;">
        ▶ Watch on YouTube
      </a>
    </div>`;
  modal.classList.remove('hidden');
  document.body.style.overflow = 'hidden';

  // Fallback timer — if iframe doesn't load properly in 4 seconds show the button
  window._ytTimer = setTimeout(()=>showYtFallback(), 4000);
}

function checkIframeError(iframe, videoId, title){
  // Try to detect blocked embed via postMessage errors — clear the timer if it loaded fine
  clearTimeout(window._ytTimer);
  // If the iframe loaded but shows error page, YouTube sends a specific message
  // We listen for it below. If no error, keep playing.
}

function showYtFallback(){
  var iframe = document.getElementById('yt-iframe');
  var fallback = document.getElementById('yt-fallback');
  if(iframe) iframe.style.display = 'none';
  if(fallback){ fallback.style.display = 'flex'; }
}

// Listen for YouTube embed errors via postMessage
window.addEventListener('message', function(e){
  if(e.data && typeof e.data === 'object' && e.data.event === 'infoDelivery'){
    if(e.data.info && e.data.info.errorCode){
      clearTimeout(window._ytTimer);
      showYtFallback();
    }
  }
  // Some YouTube errors come as strings
  if(typeof e.data === 'string' && e.data.includes('{"event":"ERROR"')){
    clearTimeout(window._ytTimer);
    showYtFallback();
  }
});

function openSearchPlayer(query, title){
  var modal = document.getElementById('videoModal');
  var frame = document.getElementById('videoModalFrame');
  var titleEl = document.getElementById('videoModalTitle');

  </div>`;
  modal.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeVideoPlayer(){
  clearTimeout(window._ytTimer);
  var modal = document.getElementById('videoModal');
  var frame = document.getElementById('videoModalFrame');
  modal.classList.add('hidden');
  frame.innerHTML = '';
  document.body.style.overflow = '';
}

document.addEventListener('click', function(e){

  if(e.target === modal) closeVideoPlayer();

  margin-top:12px;padding-top:12px;border-top:1px solid rgba(217,119,6,0.2);
}
.pm-section-title{
  font-family:'Fraunces',serif;font-size:15px;font-weight:800;
  color:var(--txt);margin-bottom:14px;
}
.pm-tier-row{
  display:flex;align-items:center;gap:12px;margin-bottom:10px;
}
.pm-tier-label{
  font-size:12px;font-weight:700;color:var(--txt2);
  min-width:64px;line-height:1.3;
}
.pm-tier-bar-wrap{
  flex:1;height:10px;background:var(--border);
  border-radius:10px;overflow:hidden;
}
.pm-tier-bar{height:100%;border-radius:10px;transition:width .6s ease;min-width:3px;}
.pm-tier-count{font-size:12px;font-weight:700;color:var(--muted);min-width:32px;text-align:right;font-family:'JetBrains Mono',monospace;}
.pm-dots{
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;
}
.pm-dot{
  width:30px;height:30px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;
  cursor:pointer;transition:all .15s;border:1.5px solid var(--border);
  color:var(--muted);background:var(--bg);
}
.pm-dot.done{background:var(--green);color:#fff;border-color:var(--green);}
.pm-dot.current{border-color:var(--gold-btn);color:var(--gold);background:var(--gold-light);}
.pm-dot:hover{transform:scale(1.1);}
.pm-footer{
  padding:16px 24px;border-top:1px solid var(--border);
  flex-shrink:0;display:flex;gap:10px;
}
.pm-footer-btn{
  flex:1;padding:12px;border:1.5px solid var(--border);
  border-radius:var(--r-sm);background:var(--bg);
  font-size:13px;font-weight:600;color:var(--txt2);cursor:pointer;
  text-align:center;transition:all .15s;
}
.pm-footer-btn:hover{border-color:var(--gold-btn);color:var(--gold);}
.pm-footer-btn.primary{
  background:linear-gradient(135deg,#F59E0B,#D97706);
  color:#fff;border-color:transparent;
}
.pm-footer-btn.primary:hover{transform:translateY(-1px);}

/* ══ VOICE READER ═════════════════════════════════════════════ */
.vr-fab{
  position:fixed;bottom:100px;right:20px;z-index:800;
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,#F59E0B,#D97706);
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
  box-shadow:0 4px 20px rgba(217,119,6,0.45);
  transition:all .2s;
  display:none;/* hidden until module is open */
}
.vr-fab:hover{transform:scale(1.1);}
.vr-fab.visible{display:flex;}
.vr-panel{
  position:fixed;bottom:0;left:0;right:0;z-index:900;
  background:var(--surface);
  border-top:1px solid var(--border);
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  box-shadow:0 -8px 32px rgba(0,0,0,0.12);
  padding:16px 20px 20px;
  transform:translateY(100%);
  transition:transform .35s cubic-bezier(.16,1,.3,1);
}
.vr-panel.open{transform:translateY(0);}
.vr-handle{
  width:40px;height:4px;background:var(--border);
  border-radius:2px;margin:0 auto 14px;
}
.vr-title{
  font-family:'Fraunces',serif;font-size:14px;font-weight:800;
  color:var(--txt);margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.vr-progress{
  width:100%;height:4px;background:var(--border2);
  border-radius:2px;margin-bottom:14px;overflow:hidden;
}
.vr-progress-bar{height:100%;background:var(--gold-btn);width:0%;transition:width .3s;}
.vr-controls{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.vr-btn{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--border);background:var(--bg);
  font-size:16px;cursor:pointer;transition:all .15s;color:var(--txt2);
  flex-shrink:0;
}
.vr-btn:hover{border-color:var(--gold-btn);color:var(--gold);}
.vr-btn.play-btn{
  width:52px;height:52px;font-size:20px;
  background:linear-gradient(135deg,#F59E0B,#D97706);
  border:none;color:#fff;
  box-shadow:0 4px 14px rgba(217,119,6,0.4);
}
.vr-btn.play-btn:hover{transform:scale(1.05);}
.vr-time{
  flex:1;font-size:12px;color:var(--muted);
  font-family:'JetBrains Mono',monospace;text-align:center;
}
.vr-bottom{display:flex;align-items:center;gap:12px;}
.vr-voice-select{
  flex:1;padding:9px 12px;
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:var(--r-sm);font-size:13px;color:var(--txt);
  font-family:'DM Sans',sans-serif;cursor:pointer;outline:none;
  transition:border-color .15s;
}
.vr-voice-select:focus{border-color:var(--gold-btn);}
.vr-speed{
  padding:9px 12px;
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:var(--r-sm);font-size:13px;color:var(--txt);
  font-family:'DM Sans',sans-serif;cursor:pointer;outline:none;
  min-width:72px;
}
.vr-close{
  width:36px;height:36px;border-radius:50%;
  background:var(--bg);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;cursor:pointer;color:var(--muted);
  transition:all .15s;flex-shrink:0;
}
.vr-close:hover{background:var(--rose-light);color:var(--rose);}
.vr-reading-indicator{
  font-size:11px;color:var(--gold);font-weight:600;
  letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;
  display:none;
}
.vr-reading-indicator.active{display:block;}
</style>
</head>
<body>

<!-- SAVE BAR -->

  <div>
    <div class="save-bar-title">Module ${String(c.id).padStart(2,'0')} — ${c.title}</div>
    <div class="save-bar-sub">Tap the button → then choose "Save as PDF" in your print menu</div>
  </div>
  <button class="save-btn" onclick="window.print()">⬇ Save as PDF</button>
</div>

<!-- COVER PAGE -->
<div class="cover-page">
  <div style="font-size:11px;letter-spacing:3px;color:${accent};text-transform:uppercase;margin-bottom:16px;font-weight:700;">The 6-Figure Digital Playbook &nbsp;·&nbsp; Tier ${c.tier}: ${(tierNames[c.tier]||'')}</div>
  <div style="font-size:13px;color:#555;margin-bottom:12px;font-weight:500;">MODULE ${String(c.id).padStart(2,'0')} OF 40</div>
  <h1 style="font-size:42px;font-weight:900;color:#fff;line-height:1.1;margin-bottom:16px;letter-spacing:-1px;">${c.title}</h1>
  <p style="font-size:18px;color:#aaa;line-height:1.6;max-width:500px;margin-bottom:48px;">${c.tagline}</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <span style="background:rgba(255,255,255,0.08);color:#ccc;font-size:13px;padding:8px 16px;border-radius:20px;">${c.lessons.length} Lessons</span>
    ${(c.actions||[]).length ? `<span style="background:rgba(255,255,255,0.08);color:#ccc;font-size:13px;padding:8px 16px;border-radius:20px;">${(c.actions||[]).length} Action Steps</span>` : ''}
    <span style="background:${accent};color:#fff;font-size:13px;padding:8px 16px;border-radius:20px;font-weight:700;">Tier ${c.tier}</span>
  </div>
</div>

<!-- OVERVIEW PAGE -->
${overviewPage}

<!-- LESSON PAGES -->
${lessonPages}

<!-- ACTION PLAN -->
${actionPage}

</body>
</html>`;

  var existing = document.getElementById('pdf-overlay');
  if(existing) existing.remove();

  var overlay = document.createElement('div');
  overlay.id = 'pdf-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#f0f0f0;overflow:auto;-webkit-overflow-scrolling:touch;';

  var iframe = document.createElement('iframe');
  iframe.style.cssText = 'width:100%;height:100%;border:none;';
  overlay.appendChild(iframe);

  var closeBtn = document.createElement('button');
  closeBtn.textContent = '✕ Close';
  closeBtn.style.cssText = 'position:fixed;top:16px;left:16px;background:#111;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer;z-index:100001;box-shadow:0 2px 8px rgba(0,0,0,0.3);font-family:inherit;';
  closeBtn.onclick = ()=>{ overlay.remove(); document.body.style.overflow=''; };
  overlay.appendChild(closeBtn);

  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';

  var iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
  iframeDoc.open();
  iframeDoc.write(fullHTML);
  iframeDoc.close();
}


// ══════════════════════════════════════════════════════════════
//  LOGOUT — properly shows gate again
// ══════════════════════════════════════════════════════════════
function doLogout(){
  if(!confirm('Lock the playbook and return to the access screen?')) return;
  try{ localStorage.removeItem('6fdp-access'); }catch(e){}
  vrStop();
  closeProgressPanel();
  hideVoiceFab();
  // Show gate
  var go = document.getElementById('gateOverlay');
  if(go){
    go.style.cssText = '';
    go.style.display = 'flex';
    go.classList.remove('hidden');
  }
  // Hide logout / progress buttons
  var dl = document.getElementById('desktopLogout');
  if(dl) dl.style.display = 'none';

  _unlocked = false;
  renderHome();
  window.scrollTo(0,0);
}

// ══════════════════════════════════════════════════════════════
//  PROGRESS PANEL
// ══════════════════════════════════════════════════════════════
function showProgressPanel(){
  var total = 40;
  var done  = completed.length;
  var pct   = Math.round((done/total)*100);
  var circ  = 251.2;
  var arc   = (pct/100)*circ;

  var msgs = [
    "Your playbook is unlocked and ready. Open Module 01 whenever you are — your journey starts with one click. 🚀",
    "Great start! You have taken the first step. Even one module a day transforms where you are in 40 days. Keep it up 💪",
    "Building momentum! Every module compounds your advantage. Come back whenever you can — your progress is always saved. ⚡",
    "You are in the top half already. Most people never get this far. Stay consistent and the results follow. 🔥",
    "Past halfway! The income models you are learning are starting to connect. You are building real knowledge now. ✨",
    "Almost there — these last modules cover the systems that tie everything together. One push and you are done. 🏆",
    "All 40 modules complete! You now have more actionable income knowledge than most people will ever gather. Go execute. 🎯"
  ];
  var msgIdx = pct===0?0: pct<10?1: pct<25?2: pct<50?3: pct<75?4: pct<100?5:6;

  // Tier table rows
  var tierRows = TIERS.map(t => {
    var tC   = courses.filter(x=>x.tier===t.id);
    var tD   = tC.filter(x=>completed.includes(x.id)).length;
    var tPct = tC.length ? Math.round((tD/tC.length)*100) : 0;
    return `<tr onclick="void(0)">
      <td class="pm-tier-name"><span class="pm-tier-dot" style="background:${t.color}"></span>${t.name}</td>
      <td style="padding:10px 12px;">
        <div class="pm-mini-bar-wrap">
          <div class="pm-mini-bar" style="width:${tPct}%;background:${t.color}"></div>
        </div>
      </td>
      <td class="pm-tier-frac" style="color:${t.color};padding:10px 12px;">${tD}/${tC.length}</td>
      <td style="padding:10px 12px;font-size:12px;font-weight:700;color:${tPct===100?'var(--green)':'var(--muted)'}">
        ${tPct===100?'✓ Done':tPct+'%'}
      </td>
    </tr>`;
  }).join('');

  // Module list rows
  var modRows = courses.map(x => {
    var isDone = completed.includes(x.id);
    var tier   = TIERS.find(t=>t.id===x.tier);
    return `<div class="pm-mod-row ${isDone?'done':''}" onclick="closeProgressPanel();goCourse(${x.id})">
      <div class="pm-mod-num">${String(x.id).padStart(2,'0')}</div>
      <div class="pm-mod-title-txt">${x.title}</div>
      <div class="pm-mod-status" style="color:${isDone?'var(--green)':tier?tier.color:'var(--muted)'}">
        ${isDone?'✓ Done':'→'}
      </div>
    </div>`;
  }).join('');

  document.getElementById('pmBody').innerHTML = `
    <!-- Donut + message -->
    <div class="pm-donut-card">
      <div class="pm-donut">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="40" fill="none" stroke="#FCD34D" stroke-width="10"/>
          <circle cx="50" cy="50" r="40" fill="none"
            stroke="${pct>0?'#D97706':'transparent'}" stroke-width="10"
            stroke-dasharray="${arc.toFixed(1)} ${circ}"
            stroke-linecap="round" transform="rotate(-90 50 50)"
            style="transition:stroke-dasharray .8s ease"/>
          <text x="50" y="44" text-anchor="middle" font-family="Georgia,serif"
            font-size="19" font-weight="900" fill="#1C1917">${pct}%</text>
          <text x="50" y="59" text-anchor="middle" font-family="sans-serif"
            font-size="9" fill="#92400E">${done}/${total}</text>
        </svg>
      </div>
      <div class="pm-donut-info">
        <div class="pm-donut-pct">${done} <span style="font-size:16px;font-weight:500">of</span> ${total}</div>
        <div class="pm-donut-sub">modules completed</div>
        <div class="pm-msg">${msgs[msgIdx]}</div>
      </div>
    </div>

    <!-- Tier table -->
    <div class="pm-section-title">Progress by Tier</div>
    <table class="pm-tier-table" style="margin-bottom:22px;">
      <thead><tr>
        <th>Tier</th><th>Progress</th><th>Done</th><th>Status</th>
      </tr></thead>
      <tbody>${tierRows}</tbody>
    </table>

    <!-- Module list -->
    <div class="pm-section-title">All 40 Modules</div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:12px;">Tap any row to jump to that module.</p>
    <div class="pm-mod-list">${modRows}</div>
    <div style="height:24px;"></div>`;

  document.getElementById('pmOverlay').classList.add('open');
  document.getElementById('pmPanel').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeProgressPanel(){
  document.getElementById('pmOverlay').classList.remove('open');
  document.getElementById('pmPanel').classList.remove('open');
  document.body.style.overflow = '';
}

function continueReading(){
  if(completed.length===0){ goCourse(1); return; }
  var sorted = [...completed].sort((a,b)=>a-b);
  var last   = sorted[sorted.length-1];
  var next   = courses.find(x=>x.id>last && !completed.includes(x.id));
  goCourse(next ? next.id : last);
}

// ══════════════════════════════════════════════════════════════
//  VOICE READER — full-screen music player
// ══════════════════════════════════════════════════════════════
var VR = {
  sentences: [], sentIdx: 0,
  isPlaying: false, isPaused: false,
  voices: [], selectedVoice: null,
  rate: 1.0, currentModuleId: null,
  utterance: null
};

function vrGetText(id){
  var m = courses.find(x=>x.id===id);
  if(!m) return '';
  var parts = ['Module '+id+'. '+m.title+'. '+m.tagline+'.'];
  if(m.intro) parts.push(m.intro);
  m.lessons.forEach(function(l,i){
    parts.push('Lesson '+(i+1)+': '+l.t+'.');
    if(l.text) parts.push(l.text);
    if(l.pts) l.pts.forEach(function(p){ parts.push(p); });
  });
  return parts.join(' ');
}

function vrSplitSentences(text){
  var raw = text.match(/[^.!?]+[.!?]+/g) || [text];
  return raw.map(function(s){ return s.trim(); }).filter(function(s){ return s.length>4; });
}

function vrLoadVoices(cb){
  function doLoad(){
    var all = window.speechSynthesis.getVoices();
    // prefer English voices, fall back to all
    var eng = all.filter(function(v){ return v.lang.startsWith('en'); });
    VR.voices = eng.length ? eng : all;
    var sel = document.getElementById('vrVoiceSelect');
    if(!sel) return;
    sel.innerHTML = VR.voices.map(function(v,i){
      return '<option value="'+i+'">'+v.name+' ('+v.lang+')</option>';
    }).join('');
    // pick first non-Google if possible (for variety)
    var preferred = VR.voices.findIndex(function(v){ return !v.name.toLowerCase().includes('google'); });
    var pick = preferred >= 0 ? preferred : 0;
    sel.selectedIndex = pick;
    VR.selectedVoice = VR.voices[pick] || null;
    if(cb) cb();
  }
  if(window.speechSynthesis.getVoices().length){ doLoad(); }
  else { window.speechSynthesis.onvoiceschanged = doLoad; }
}

function vrInit(moduleId){
  VR.currentModuleId = moduleId;
  var m = courses.find(x=>x.id===moduleId);
  VR.sentences = vrSplitSentences(vrGetText(moduleId));
  VR.sentIdx = 0; VR.isPlaying = false; VR.isPaused = false;
  var name = m ? 'Module '+moduleId+': '+m.title : 'Module '+moduleId;
  var mn = document.getElementById('vrModName');
  if(mn) mn.textContent = name;
  vrUpdateUI();
  vrLoadVoices();
}

function vrUpdateUI(){
  var total = VR.sentences.length;
  var idx   = VR.sentIdx;
  var pct   = total ? Math.round((idx/total)*100) : 0;
  var sf = document.getElementById('vrSeekFill');
  if(sf) sf.style.width = pct+'%';
  var sc = document.getElementById('vrSentCounter');
  if(sc) sc.textContent = total ? (idx+1)+' / '+total+' sentences' : '—';
  var tl = document.getElementById('vrTimeLeft');
  if(tl) tl.textContent = idx;
  var tr = document.getElementById('vrTimeRight');
  if(tr) tr.textContent = total;
  var cap = document.getElementById('vrCaption');
  if(cap && VR.sentences[idx]){
    cap.textContent = VR.sentences[idx];
    cap.classList.toggle('active', VR.isPlaying);
  }
  var pb = document.getElementById('vrPlayBtn');
  if(pb) pb.textContent = VR.isPlaying ? '⏸' : '▶';
}

function vrSpeak(text, onEnd){
  window.speechSynthesis.cancel();
  var utt = new SpeechSynthesisUtterance(text);
  if(VR.selectedVoice) utt.voice = VR.selectedVoice;
  utt.rate  = VR.rate;
  utt.pitch = 1.0;
  utt.onend   = onEnd;
  utt.onerror = function(e){ if(e.error !== 'interrupted'){ VR.sentIdx++; vrSpeakCurrent(); } };
  VR.utterance = utt;
  window.speechSynthesis.speak(utt);
}

function vrSpeakCurrent(){
  if(!VR.isPlaying || VR.sentIdx >= VR.sentences.length){ vrStop(); return; }
  vrUpdateUI();
  vrSpeak(VR.sentences[VR.sentIdx].trim(), function(){
    if(VR.isPlaying){ VR.sentIdx++; vrSpeakCurrent(); }
  });
}

function vrPlay(){
  if(VR.sentIdx >= VR.sentences.length) VR.sentIdx = 0;
  VR.isPlaying = true; VR.isPaused = false;
  vrSpeakCurrent();
}

function vrTogglePlay(){
  if(!VR.isPlaying && !VR.isPaused){ vrPlay(); }
  else if(VR.isPlaying){
    window.speechSynthesis.cancel();
    VR.isPlaying = false; VR.isPaused = true;
    vrUpdateUI();
  } else {
    vrPlay();
  }
}

function vrStop(){
  window.speechSynthesis.cancel();
  VR.isPlaying = false; VR.isPaused = false;
  VR.sentIdx = 0;
  vrUpdateUI();
  var cap = document.getElementById('vrCaption');
  if(cap){ cap.textContent = 'Press play to start reading.'; cap.classList.remove('active'); }
}

function vrSkipBack(){
  var was = VR.isPlaying;
  window.speechSynthesis.cancel();
  VR.isPlaying = false; VR.isPaused = false; VR.sentIdx = 0;
  vrUpdateUI();
  if(was) setTimeout(vrPlay, 80);
}

function vrJump(n){
  var was = VR.isPlaying;
  window.speechSynthesis.cancel();
  VR.isPlaying = false;
  VR.sentIdx = Math.max(0, Math.min(VR.sentences.length-1, VR.sentIdx + n));
  vrUpdateUI();
  if(was) setTimeout(vrPlay, 80);
}

function vrSeekClick(e){
  var rect = e.currentTarget.getBoundingClientRect();
  var ratio = (e.clientX - rect.left) / rect.width;
  var was = VR.isPlaying;
  window.speechSynthesis.cancel();
  VR.isPlaying = false;
  VR.sentIdx = Math.round(ratio * (VR.sentences.length - 1));
  vrUpdateUI();
  if(was) setTimeout(vrPlay, 80);
}

function vrSetVoice(){
  var sel = document.getElementById('vrVoiceSelect');
  var idx = parseInt(sel ? sel.value : 0);
  VR.selectedVoice = VR.voices[idx] || null;
  if(VR.isPlaying){ var was=VR.sentIdx; vrStop(); VR.sentIdx=was; setTimeout(vrPlay,80); }
}

function vrSetSpeed(){
  VR.rate = parseFloat(document.getElementById('vrSpeed').value||'1');
  if(VR.isPlaying){ var was=VR.sentIdx; vrStop(); VR.sentIdx=was; setTimeout(vrPlay,80); }
}

function openVoiceScreen(){
  document.getElementById('vrScreen').classList.add('open');
  document.body.style.overflow = 'hidden';
  vrLoadVoices();
}
function closeVoiceScreen(){
  vrStop();
  document.getElementById('vrScreen').classList.remove('open');
  document.body.style.overflow = '';
}

function showVoiceFab(moduleId){
  vrInit(moduleId);
  document.getElementById('vrFab').classList.add('visible');
}
function hideVoiceFab(){
  vrStop();
  var fab = document.getElementById('vrFab');
  if(fab) fab.classList.remove('visible');
  var sc = document.getElementById('vrScreen');
  if(sc) sc.classList.remove('open');
}

</script>
