  outcomes:["Build a 5-page business website in Webflow from a blank canvas that passes a professional quality bar","Design wireframes and visual mockups in Figma that clients approve before a single line is built","Price web design projects using a value-based framework rather than hourly guessing","Write a contract that protects you from scope creep, delayed client feedback, and non-payment","Manage client communication and revision requests without letting a project drag past its deadline","Convert a project client into a recurring maintenance retainer on the day the site launches","Build a portfolio of 3 to 5 sites that communicates your design taste before a prospect even contacts you"],
  caseStudy:{title:"How four concept websites and a single Twitter post turned into a \u20a6500k/month web design business",text:"A recent graduate who had been teaching himself HTML and CSS since secondary school decided to stop learning and start building. He spent three weeks creating four complete concept websites for fictional businesses: a Lagos restaurant, a law firm, a personal trainer, and a boutique hotel. None of these clients existed. He designed them as if they did, using realistic copy he wrote himself and professional photography from Unsplash. He hosted all four on Webflow and built a portfolio site linking to each one. He posted the portfolio on Twitter with a direct caption noting that he was available for businesses with websites built before 2020 or sites they were embarrassed to share. Three real businesses reached out within 48 hours. His first three projects were priced at \u20a6180,000, \u20a6240,000, and \u20a6300,000. After delivering each, he offered a monthly maintenance retainer at \u20a625,000. All three accepted. By month four he had eight projects in his active pipeline and six maintenance retainers running. By month nine he had completed more than twenty website projects and was bringing in just over \u20a6500,000 per month from project fees and retainers combined.",result:"Over \u20a6500k/month in month nine from project fees and maintenance retainers, starting with four concept builds and one Twitter post"},
  realityCheck:"Web design has a specific failure mode that catches most beginners: the client who changes their mind indefinitely. You design a homepage, they approve it, you build it, they ask for it to look different. You redesign it, they approve it, you build it, they ask for the colors to match their cousin's preference. This loop continues until either you run out of patience and deliver something half-finished or you deliver something full-featured 4 months late and burn your margin entirely. The protection is entirely in the contract: define exactly what is included (how many pages, how many design revision rounds, what counts as a revision versus a new request), and price any scope addition at a clear daily rate written into the contract before work begins. The web designers earning \u20a6500k per month are not faster or more talented. They are better at contracts and client management. That skill is learnable in one afternoon reading a good contract template.",
  intro:"Web design and development remains one of the most in-demand and best-compensated freelance services because every business needs a website, most already have one that is embarrassing, and the barrier to building a modern, professional replacement has dropped dramatically with no-code tools. A skilled web designer who can deliver fast, beautiful, conversion-focused websites earns \u20a6300,000 to \u20a65,000,000 per project and builds a client base that generates stable monthly income through maintenance retainers. The skill requires no computer science degree, no expensive software, and no advertising budget. It requires the ability to design well, communicate clearly, and deliver on time consistently.",
  lessons:[
    {t:"Building a Portfolio Before You Have Any Clients",
     text:"The most common reason new web designers cannot land clients is not that they lack skill. It is that they cannot prove their skill to someone who has never worked with them. The solution is to build proof before anyone asks for it. Your first 3 to 5 websites should be designed and built for concept clients: real business types, realistic content, professional photography, genuine copywriting. When a prospect sees a beautifully executed restaurant website, they do not ask whether the restaurant was a real client. They see evidence that you can build their site.",
     pts:["The concept site formula: pick 5 business types that need websites and have clear aesthetic standards (restaurants, hotels, fitness studios, law firms, medical clinics, creative agencies). For each one, write the copy as if you are the business, find photography on Unsplash or Pexels, and build a complete 5 to 7-page site with Home, About, Services, Portfolio or Menu, Testimonials, and Contact pages. This process takes 40 to 60 hours total. The result is a portfolio that communicates professional capability without a single real client.","The redesign approach that generates immediate outreach opportunities: find 10 local businesses with visibly outdated or broken websites. Screenshot their current site. Redesign the homepage in Figma. Send them the comparison with one sentence: 'I redesigned your homepage to see what it could look like. Happy to share the Figma file if you are interested in discussing a full site.' This approach sends real evidence of what you can do for their specific business, which is more persuasive than any general portfolio.","Specializing by industry to command higher rates: a generalist web designer bids on every project and competes on price. A web designer who has built 6 restaurant websites, understands the specific pages a restaurant needs (online menu, reservation booking, private dining inquiry, location page), and can speak intelligently about conversion optimization for hospitality businesses charges 2 to 3 times more for the same hours of work because their expertise reduces the client's uncertainty about getting a good result.","Your portfolio site as a client acquisition tool: your own website is your most visible demonstration of capability. It must be fast (under 2 seconds load time), mobile-perfect, visually distinctive, and easy to navigate. Many web designers have portfolio sites that look like default templates, which is the worst possible signal to a potential client. Spend as much time on your own site as you would on a paying client's site. It is the first piece of work every prospect evaluates.","Photography and copy as the difference between a site that looks average and one that looks exceptional: the quality of a website in a client's eyes is 70 percent determined by the photography and copy on it, not the design or development. If a client's product photography is poor and their copy is generic, even a beautifully designed site will look mediocre. Include photography sourcing and copy review as part of your discovery process. For clients with weak photography, recommend a professional shoot and build it into the project quote. The resulting site will be dramatically better and both parties will be proud of it.","Building in public to generate inbound work: posting your design work on Twitter, LinkedIn, Dribbble, and Behance creates inbound interest without cold outreach. Post before-and-after redesigns, work-in-progress screenshots, and completed project reveals. The Nigerian design community on Twitter is active and business owners looking for designers pay attention to it. One viral post from a compelling redesign can produce more client inquiries than 100 cold emails."]},
    {t:"Pricing, Contracts, and Managing Projects Without Losing Your Margin",
     text:"The economics of web design are straightforward in principle and routinely destroyed in practice by two things: underpricing out of fear and scope creep from poorly written contracts. These two problems are related. When you undercharge, you attract clients who value price over quality, who are more likely to push for unlimited revisions, and who are less likely to respect your time. When you charge confidently and define scope clearly, you attract clients who are there for the result, not the price.",
     pts:["Value-based pricing instead of hourly rates: never quote web design by the hour to a client. Hourly pricing invites the client to evaluate whether each hour was worth the rate, which creates friction and suspicion. Quote by the project, with a clear deliverable list. Your project price should reflect the value the website delivers to the business, not the hours it takes you to build it. A restaurant website that generates 50 online reservations per month at \u20a620,000 average spend is worth \u20a61,000,000 per month to the business. Your project fee of \u20a6500,000 is a clear and obvious investment at that return.","Pricing tiers that make the conversation easy: set three standard project tiers before you start selling. Basic (\u20a6250,000 to \u20a6400,000): 5-page brochure site, Webflow or WordPress, 1 design revision round, 2-week delivery. Standard (\u20a6450,000 to \u20a6800,000): 8 to 12-page site with custom interactions, contact form with CRM integration, 2 design revision rounds, 4-week delivery. Premium (\u20a6900,000 to \u20a62,500,000): full brand-to-site build, e-commerce or booking integration, 3 design revision rounds, custom animations, 6 to 8-week delivery. Having these tiers ready means every sales conversation starts with context rather than starting from zero.","The contract clause that prevents every major project problem: include these four specific clauses in every contract before you start. Scope definition (list every page and every feature included, anything not listed is a scope addition billed at your day rate). Revision rounds (maximum 2 rounds of revisions to the design and 1 round to the live site, additional rounds at \u20a630,000 per round). Client response time (client must provide feedback within 5 business days of each milestone delivery, failure to do so pauses the timeline). Payment terms (50 percent deposit before work begins, 25 percent at design approval, 25 percent at site launch). These four clauses prevent 90 percent of the problems that destroy web design project margins.","The 50 percent deposit rule that filters unserious clients: never start designing without receiving the deposit. The deposit is not about trust. It is about commitment. A client who has paid \u20a6150,000 to start a \u20a6300,000 project takes feedback calls seriously, responds promptly, and treats the project as an investment. A client who has not yet paid for anything treats your time as low-cost. The deposit creates the dynamic you need to deliver good work efficiently.","Monthly maintenance retainers as compounding income: launch day is the best moment to sell the maintenance retainer because the client is excited, the relationship is at its highest point, and they have just experienced how much better their digital presence looks. Offer a retainer covering: monthly WordPress or Webflow platform updates, weekly backup verification, one hour of content changes per month, and email support with 24-hour response time. Price at \u20a620,000 to \u20a660,000 per month depending on site complexity. 10 maintenance clients generates \u20a6200,000 to \u20a6600,000 per month from work that takes 5 to 10 hours total. This is the recurring income layer that makes web design a sustainable business rather than a perpetual hustle for new projects.","Handling the client who wants changes after launch: define clearly in the contract that post-launch change requests outside the maintenance retainer are billed at your day rate. This is not unfriendly. It is professional. A client who asks for a new section added 3 months after launch, after the site is live and being used, is requesting new work, not completing old work. Charge for it. Clients who respect your expertise will understand. Clients who do not are the ones whose projects you should not take in the first place."]},
    {t:"Conversion-Focused Design: Building Sites That Generate Business, Not Just Compliments",
     text:"A beautiful website that does not convert visitors into enquiries or sales has failed its primary purpose regardless of how it looks. Most small business websites are designed to impress, not to convert. Understanding the difference and applying it to every project you build is the skill that separates designers who charge \u20a6200,000 per site from those who command \u20a61,500,000 and get referrals from every client.",
     pts:["The above-the-fold rule that most local business sites violate: everything a visitor needs to understand what the business does, who it serves, and what to do next should be visible without scrolling. Most local business homepages waste this space with generic hero images and vague taglines that communicate nothing. A converting homepage hero section has: a clear headline stating who the business serves and what specific outcome they provide, a subheading with one supporting detail (years of experience, number of clients served, specific service location), and one primary call to action button. Three elements. That is all the above-the-fold section needs to do.","Trust signals that convert skeptical visitors: online visitors do not know the businesses they land on. Before they contact or buy, they are looking for signals that the business is legitimate and capable. The trust signals that move visitors to action: real client testimonials with full names and (where appropriate) photos or business names, a visible phone number and physical address in the header, a team section with real photos and brief bios, social proof numbers (number of clients, years in business, projects completed), and any relevant certifications or memberships. Include all of these on every client site and conversion rates improve measurably.","CTA placement strategy that captures visitors at every decision point: place a primary call to action at the top of the page, after every major section of content, and at the bottom of the page. Each CTA should be specific to what the visitor just read: after the services section, the CTA should be 'Request a Free Quote', not a generic 'Contact Us'. After a testimonials section, the CTA should be 'Join 200+ businesses we have worked with.' Match the CTA text to the emotional state of a visitor who just finished reading that section.","Page speed as a conversion and SEO factor you must measure and optimize: a site that loads in under 2 seconds on mobile converts at a measurably higher rate than one loading in 5 seconds. Every client site you deliver should score above 80 on Google PageSpeed Insights for mobile. Common fixes: compress all images to WebP format before uploading (a single uncompressed hero image can add 2 to 3 seconds of load time), use a fast CDN like Cloudflare, defer non-essential JavaScript, and choose a hosting provider optimized for performance (Webflow hosting, Kinsta, or WP Engine for WordPress all perform significantly faster than generic shared hosting).","The mobile-first design process that eliminates rework: design the mobile layout before the desktop layout on every project. More than 60 percent of small business website visitors arrive on mobile devices. A site that looks perfect on desktop and broken on mobile is failing the majority of its visitors. In Figma or Webflow, start at 375px wide, establish the full content hierarchy and visual hierarchy at mobile size, then expand to desktop and add layout complexity. This order prevents the common problem of a beautifully designed desktop site that collapses into an unreadable mess on mobile.","Analytics setup as a handover deliverable that differentiates your service: at launch, set up Google Analytics 4 and connect Google Search Console to the client's site. Create a simple one-page guide showing the client how to check their monthly visitors, where traffic comes from, and which pages are most visited. Most web designers do not do this. Clients who understand their website's performance data are more engaged, more likely to invest in improvements, and more likely to refer you. It takes 45 minutes and positions you as a strategic partner rather than a contractor who delivers and disappears."]}
  ],
  tools:[
{name:"Webflow",icon:"\uD83C\uDF10",cat:"Web Design & Build",catColor:"rgba(0,229,255,0.12)",catTxt:"#00B8CC",cost:"Free tier",costType:"free",steps:[
  "Go to <strong>webflow.com</strong> and sign up free. Click <strong>New Project &rarr; Blank Canvas</strong>. The Designer opens with the Navigator (page structure), Canvas (visual preview), and Style Panel (CSS properties) visible simultaneously.",
  "Press <strong>A</strong> to open the Add Element panel. Add a <strong>Section</strong>, then a <strong>Container</strong> inside it (set to 1200px max-width), then your content elements inside the Container. This structure keeps every section properly bounded and responsive.",
  "Select any element and use the <strong>Style Panel</strong> on the right to apply CSS visually: width, height, padding, margin, typography, background, border, and shadow. All changes are real CSS — Webflow writes clean, exportable code from every visual adjustment.",
  "Set up <strong>Responsive Design</strong>: click the Tablet or Phone icon at the top bar to enter the mobile breakpoint. Adjust layout and spacing for each screen size. Changes cascade down (desktop settings apply to tablet unless you override them).",
  "Add <strong>Interactions</strong>: select any element, open the Interactions panel, add a trigger (scroll into view, mouse hover, page load). Set up reveal animations for sections, button hover states, and navigation effects without writing JavaScript.",
  "To publish: click <strong>Publish &rarr; Publish to webflow.io</strong> for a free staging link to share with the client for review. Connect a custom domain under <strong>Project Settings &rarr; Hosting</strong> when the client is ready to go live."
]},
{name:"Figma",icon:"\u270F",cat:"Design & Prototyping",catColor:"rgba(123,110,255,0.12)",catTxt:"#7B6EFF",cost:"Free tier",costType:"free",steps:[
  "Go to <strong>figma.com</strong> and sign up free. Click <strong>New Design File</strong>. Press <strong>F</strong> to create a Frame. Select the <strong>Desktop preset (1440px wide)</strong> for desktop design. Create a second Frame at 375px for mobile.",
  "Build your page layout using: <strong>R</strong> (rectangle for containers and placeholders), <strong>T</strong> (text), <strong>I</strong> (image import). Use auto-layout (Shift+A on any frame) to create rows and columns that resize correctly.",
  "Create <strong>Components</strong> for any element that repeats: navigation bar, footer, button styles, card templates. Select the element, press Ctrl+Alt+K (Mac: Cmd+Option+K). Editing the main component updates every instance across all pages.",
  "Set up <strong>Prototype</strong> connections: click the Prototype tab. Drag from a button to the next frame to create a clickable link. Press Play to demo the clickable prototype to the client for feedback before any build work begins.",
  "Share with clients: click <strong>Share &rarr; Anyone with link &rarr; Can View</strong>. Clients can comment directly on the design using the comment tool. This replaces email feedback chains with specific, located feedback.",
  "Use <strong>Dev Mode</strong> (free with Figma): developers or you can inspect exact CSS values (padding, font size, hex colors, border radius) by clicking any element in Dev Mode. This is the spec sheet for your own Webflow build."
]},
{name:"HoneyBook",icon:"\uD83D\uDCDD",cat:"Client Management",catColor:"rgba(255,202,44,0.12)",catTxt:"#C8841A",cost:"$16/mo",costType:"paid",steps:[
  "Go to <strong>honeybook.com</strong> and start a free trial (first 6 months at $1/month for new users). HoneyBook manages proposals, contracts, invoices, and client communication in one link-based flow.",
  "Go to <strong>Templates &rarr; Proposals</strong>. Build your web design proposal template: project scope, deliverables list, timeline, payment schedule (50% deposit, 25% at design approval, 25% at launch), and a pricing summary. Reuse for every new client.",
  "Go to <strong>Templates &rarr; Contracts</strong>. Build your contract with: scope of work list, revision round limit (2 rounds), client feedback response window (5 business days), IP transfer on final payment, and your day rate for out-of-scope work.",
  "Send a combined <strong>Brochure + Proposal + Contract + Invoice</strong> as one link. The client reads your services, reviews the proposal, signs the contract, and pays the deposit in one seamless flow without printing or scanning anything.",
  "Enable <strong>Automations</strong>: when a contract is signed, automatically send the project kickoff email and the first invoice. When the first invoice is paid, send the discovery questionnaire. These automations save 2 to 3 hours per new client.",
  "Track all projects in the <strong>Projects dashboard</strong>: see which clients are in design phase, which are in review, which have outstanding invoices. Never lose track of where any project stands or what the next action is."
]}
],
  actions:["Build your first concept site this week. Pick any business type, write the copy, find photography on Unsplash, and build a complete 5-page site in Webflow. Do not launch it for a real client yet. Just build it.","Build 2 more concept sites over the next 2 weeks. After 3 sites, you have a portfolio. Build your portfolio site linking to all three and publish it.","Post one of your concept sites on Twitter or LinkedIn with a brief note about what problem you designed it to solve. Do this every week. This is your content marketing.","Identify 10 local businesses with websites that embarrass them. Screenshot the current site, redesign the homepage in Figma, and send the comparison as a personalized outreach message.","Write your contract before you have clients. Include: scope list, revision rounds, client response time clause, payment terms, and day rate for scope additions. Get a basic template from Bonsai or HoneyBook and customize it.","Set your three pricing tiers now. Write them down. Know your Basic, Standard, and Premium prices before your first sales call. Having a number ready signals confidence and closes faster than needing to 'think about it.'","On the day you launch any client's site, offer the maintenance retainer in the same conversation. The launch day is the highest-energy moment in the client relationship. That is when to sell the next recurring service."],
  videos:[{t:"How to Start a Web Design Business in 2024",url:"https://www.youtube.com/results?search_query=web+design+business+start+2024",ch:"Flux Academy"},{t:"Webflow Full Tutorial for Beginners 2024",url:"https://www.youtube.com/results?search_query=webflow+full+tutorial+beginners+2024",ch:"Webflow"}]
},

{id:31,tier:5,title:"Video Editing Business",tagline:"Edit video for creators, brands, and businesses at $200 to $2,000 per video",tag:"Creative",img:IMGS.video,
  stats:[{l:"Startup Cost",v:"₦0-₦50k"},{l:"Income Potential",v:"₦100k-₦1M/mo"},{l:"First Income",v:"1-2 weeks"},{l:"Difficulty",v:"Beginner"}],
  flow:[{l:"Learn Editing Software",s:"DaVinci or Premiere"},{l:"Build Portfolio",s:"Edit sample videos"},{l:"Find Creator Clients",s:"YouTube and social"},{l:"Retainer Agreements",s:"Monthly stable income"}],
  intro:"The explosion of YouTube, TikTok, podcasts, and corporate video content has created enormous, sustained demand for skilled video editors. YouTube creators with 100,000 or more subscribers routinely pay $500 to $2,000 per video and need editors consistently every week. Corporate clients pay even more for polished brand content. Video editing is a learnable skill with a clear path from beginner to $5,000 per month in under 6 months.",
  lessons:[
    {t:"Building Video Editing Skills That Clients Pay For",pts:["Learn DaVinci Resolve first: it is completely free, industry-standard, and more than capable for any commercial video editing work","Study the videos that perform best in your target niche and reverse engineer their editing style: pacing, color grade, text overlays, music choices, and transition frequency","Short-form editing (TikTok and Reels) is the fastest entry point: shorter videos, faster turnaround, and enormous demand from creators who post daily but cannot edit daily","Long-form editing for YouTube requires understanding narrative structure, viewer retention optimization, and color grading for different camera systems"]},
    {t:"Finding and Retaining Editing Clients",pts:["Target YouTube creators in the 10,000 to 100,000 subscriber range. They have budget, they post consistently, and they are not yet working with large agencies","Send a loom video as your outreach: record a 90-second video pointing out one specific edit they made that worked well and one thing you would improve. This immediately demonstrates your eye for editing","Retainer agreements: offer to edit 4 to 8 videos per month at a set monthly rate. Creators prefer this for budgeting predictability and editors prefer it for income stability","Build editing templates for each client: intro sequences, lower thirds, b-roll libraries, and color grade presets. These reduce your editing time per video significantly as the relationship matures"]}
  ],
  tools:[
{name:"DaVinci Resolve",icon:"🎬",cat:"Professional Editing",catColor:"rgba(123,110,255,0.12)",catTxt:"#7B6EFF",cost:"Free",costType:"free",steps:[
  "Download free from <strong>blackmagicdesign.com</strong>. Open and click <em>New Project</em>. Go to <strong>Project Settings</strong> and set timeline resolution to 1920x1080 (1080p).",
  "Import client footage: go to <strong>Media Pool → right-click → Import Media</strong>. Drag clips to the timeline on the <strong>Edit</strong> page.",
  "Use <strong>Blade Tool (B)</strong> to cut clips. Use <strong>Selection Tool (A)</strong> to move and delete. Delete gaps by right-clicking empty spaces → <em>Ripple Delete</em>.",
  "Add titles: go to <strong>Effects Library → Titles</strong>. Drag a title onto the timeline above your clips. Double-click to edit the text in the Inspector panel.",
  "Color grade on the <strong>Color</strong> page: use the Primaries wheels (Lift = shadows, Gamma = midtones, Gain = highlights). Apply a LUT for a quick cinematic look.",
  "Export: go to <strong>Deliver</strong> page. Choose <em>YouTube 1080p</em> preset. Click <em>Add to Render Queue → Render All</em>."
]},
{name:"Frame.io",icon:"🖼",cat:"Client Review",catColor:"rgba(0,229,255,0.12)",catTxt:"#00B8CC",cost:"Free tier",costType:"free",steps:[
  "Go to <strong>frame.io</strong> and sign up free (free: 2GB storage). Click <em>New Project</em> and name it after the client.",
  "Upload your video export. Frame.io generates a review link automatically.",
  "Share the link with the client: <em>Here is your first edit for review: [link]</em>. They do not need a Frame.io account.",
  "Clients leave time-coded comments by clicking directly on the video at any moment. You see comments with exact timestamps like <em>0:24 — Change this text</em>.",
  "Check the <strong>Comments</strong> panel to see all feedback. Click any comment to jump to that exact moment in the video.",
  "When revisions are done upload the new version. Frame.io keeps version history so clients can compare V1 vs V2 side by side."
]},
{name:"Notion (Editing Pipeline)",icon:"📋",cat:"Project Management",catColor:"rgba(255,202,44,0.12)",catTxt:"#C8841A",cost:"Free",costType:"free",steps:[
  "Go to <strong>notion.so</strong>. Create a database called <strong>Video Projects</strong>.",
  "Add columns: Client Name, Project Title, Footage Received (date), First Cut Due, Revision 1 Due, Final Due, Status, Frame.io Link, Invoice Status.",
  "Create a <strong>Kanban View</strong> grouped by Status: Not Started → Editing → Client Review → Revisions → Final Delivery → Invoiced.",
  "Set <strong>Reminders</strong> on due date fields — Notion sends you a notification when a deadline is approaching.",
  "Create a client-facing <strong>shared page</strong> for each project: project timeline, revision guidelines (2 rounds max), file delivery format, and Frame.io review link.",
  "Track your editing rate: add a <strong>Hours Spent</strong> column. Divide invoice amount by hours to find your effective hourly rate and adjust pricing accordingly."
]}
],
  actions:["Install DaVinci Resolve and complete a free beginner course to learn the fundamentals","Edit 5 sample videos from public footage to build your initial reel","Identify 20 YouTube creators in a niche you follow who post at least once per week","Send personalized Loom video pitches to each creator showing your editing instincts","Aim for 3 retainer clients within 60 days and track your income and hours per client carefully"],
  videos:[{t:"How to Start a Video Editing Business in 2024",url:"https://www.youtube.com/results?search_query=video+editing+business+2024+Sorelle+Amore+2024",ch:"Sorelle+Amore"},{t:"Video Editor: How to Get Clients and Scale 2024",url:"https://www.youtube.com/results?search_query=video+editor+clients+scale+2024+Aidin+Robbins+2024",ch:"Aidin+Robbins"}]
},
{id:32,tier:5,title:"Virtual Assistant Business",tagline:"Provide remote support to businesses and entrepreneurs at $25 to $75 per hour",tag:"Service",img:IMGS.people,
  stats:[{l:"Startup Cost",v:"₦0"},{l:"Income Potential",v:"₦80k-₦500k/mo"},{l:"First Income",v:"1-2 weeks"},{l:"Difficulty",v:"Beginner"}],
  flow:[{l:"Define Your Services",s:"Admin, social, or tech VA"},{l:"Find Clients",s:"Upwork or outreach"},{l:"Deliver Consistently",s:"Reliability is everything"},{l:"Expand and Specialize",s:"Higher rates over time"}],
  intro:"Virtual assistants provide remote administrative, technical, or creative support to entrepreneurs, executives, and small businesses. The VA market is accessible to anyone with organizational skills, attention to detail, and reliable internet access. Starting rates are $15 to $25 per hour, but specialized VAs with specific skills command $50 to $150 per hour. The path to high income is specialization.",
  lessons:[
    {t:"High-Value VA Specializations That Command Premium Rates",pts:["Executive Assistant VA: calendar management, email filtering, travel booking, and meeting preparation for senior executives. $40 to $80 per hour","Social Media VA: content scheduling, hashtag research, DM management, and basic graphic creation. $25 to $50 per hour","Podcast VA: editing coordination, show notes writing, guest outreach, and episode scheduling. $30 to $60 per hour","E-commerce VA: product listing, order management, customer service tickets, and inventory tracking. High demand from Shopify and Amazon sellers"]},
    {t:"Building a Full Client Roster Within 30 Days",pts:["Start with Upwork or Fiverr to build your first 3 to 5 reviews. Yes, rates will be lower here initially, but the review system is your fastest path to credibility","After 3 successful projects, start direct outreach to entrepreneurs in your niche. Warm outreach through LinkedIn or Twitter converts at far higher rates than cold emails","Offer a 2-hour trial session at a reduced rate. Clients who try your work at low risk almost always convert to long-term arrangements if the quality is there","Your biggest competitive advantage as a VA is proactive communication. Clients do not want to chase you for updates. Regular progress messages and confirmation of task completion builds trust faster than any portfolio"]}
  ],
  tools:[
{name:"Notion (VA Operations)",icon:"📋",cat:"Organization",catColor:"rgba(123,110,255,0.12)",catTxt:"#7B6EFF",cost:"Free",costType:"free",steps:[
  "Go to <strong>notion.so</strong>. Create a <strong>Client Hub</strong> with one page per client. Inside each client page: their SOPs, login info (use LastPass for passwords), recurring tasks, and notes.",
  "Create a <strong>Daily Task Board</strong> as a Kanban database: Today, In Progress, Waiting on Client, Done. Move tasks across columns throughout your day.",
  "Create a <strong>Time Log</strong> database: Client, Task, Start Time, End Time, Duration, Billable. Fill this in for every task. This is your invoice source.",
  "Build an <strong>SOP Library</strong>: document every repeatable task as a step-by-step procedure. If you hire a subcontractor later, hand them the SOP and they're trained.",
  "Create an <strong>Onboarding Template</strong>: a checklist for every new client — access requests, communication preferences, working hours, and first deliverables.",
  "Share client-specific Notion pages with clients: they see their project status and can leave requests directly in their page."
]},
{name:"Google Workspace",icon:"📧",cat:"Communication",catColor:"rgba(0,240,134,0.12)",catTxt:"#00C070",cost:"$6/mo",costType:"paid",steps:[
  "Go to <strong>workspace.google.com</strong> and sign up ($6/user/month). Get a professional email: <em>yourname@yourbusiness.com</em>.",
  "Use <strong>Gmail</strong> for client email. Set up email signatures with your name, title, and calendar booking link.",
  "Set up <strong>Google Drive folders</strong> per client: Client Name → Projects → [Project Name] → Deliverables / Working Files / Assets. Share the folder with the client.",
  "Use <strong>Google Calendar</strong> to block your working hours, schedule client check-in calls, and set task deadlines. Share your calendar availability via Calendly.",
  "Use <strong>Google Meet</strong> for video calls — it's free and requires no download for clients. Add it as the default meeting link in Calendly.",
  "Use <strong>Docs and Sheets</strong> for collaborative work with clients — they can see updates in real time and leave comments on specific sections."
]},
{name:"Loom (Async Updates)",icon:"🎥",cat:"Video Updates",catColor:"rgba(255,45,107,0.12)",catTxt:"#CC2255",cost:"Free tier",costType:"free",steps:[
  "Go to <strong>loom.com</strong> and install the Chrome extension. Free plan: unlimited videos up to 5 minutes.",
  "Use Loom instead of long emails: record a 2-minute screen share showing exactly what you did and what you need from the client.",
  "For daily updates: <em>Click record → Screen + Camera → record a 60-second summary of today's work completed</em>. Send the link in Slack or email.",
  "For training: record your screen as you perform a task. Send the Loom link as documentation the client can rewatch anytime.",
  "Use Loom to ask questions: <em>I need clarification on X, Y, Z — here is a quick video explaining what I mean</em>. Faster than email chains.",
  "Check <strong>Loom Analytics</strong> to see if clients watched your videos. If they did not watch, follow up. If they did, they have the information."
]}
],
  actions:["List every professional skill you have that could help another business owner","Create a simple service menu with 3 to 5 VA packages at fixed hourly or monthly rates","Set up profiles on Upwork, Fiverr, and LinkedIn with a clear niche focus","Apply to 10 jobs per day on Upwork for the first 30 days","Transition at least 2 freelance clients to monthly retainers within 60 days of starting"],
  videos:[{t:"How to Become a Virtual Assistant in 2024",url:"https://www.youtube.com/results?search_query=become+virtual+assistant+2024+Abbey+Ashley+2024",ch:"Abbey Ashley"},{t:"Virtual Assistant Business: Get Clients Fast 2024",url:"https://www.youtube.com/results?search_query=virtual+assistant+business+clients+fast+Kayla+Sloan+2024",ch:"Kayla+Sloan"}]
},
{id:33,tier:5,title:"Graphic Design Income Streams",tagline:"Turn visual skills into freelance income, digital products, and passive revenue",tag:"Creative",img:IMGS.design,
  stats:[{l:"Startup Cost",v:"₦0-₦20k/mo"},{l:"Income Potential",v:"₦100k-₦1M/mo"},{l:"First Income",v:"1-4 weeks"},{l:"Difficulty",v:"Intermediate"}],
  flow:[{l:"Build Design Skills",s:"Canva or Adobe"},{l:"Choose Income Stream",s:"Freelance or products"},{l:"Build Portfolio",s:"Show your best work"},{l:"Scale and Diversify",s:"Multiple revenue sources"}],
  intro:"Graphic design skills can generate income through four distinct channels simultaneously: freelance client work, digital product sales, stock asset submissions, and print-on-demand products. A designer who understands business can combine all four streams to build income that is resilient, diversified, and scalable. The barrier to entry has never been lower with tools like Canva, but the ceiling has never been higher for those who develop genuine design expertise.",
  lessons:[
    {t:"The 4 Income Streams for Graphic Designers",pts:["Freelance client work: logos, brand identities, social media graphics, and marketing materials for businesses at $500 to $5,000 per project","Digital product sales: Canva templates, icon packs, font pairs, and brand kit templates sold on Creative Market, Etsy, or Gumroad for passive income","Stock submissions: original illustrations, vectors, and graphics submitted to Shutterstock, Adobe Stock, and iStock for royalty payments whenever your work is downloaded","Print-on-demand: original designs applied to apparel, stationery, and home goods sold through Printful or Redbubble without any inventory cost"]},
    {t:"Building a Portfolio That Gets Freelance Clients",pts:["Quality over quantity: 5 outstanding portfolio pieces beat 20 mediocre ones. Choose your absolute best work and present it with context: who was the client, what was the problem, what solution did you design","Behance and Dribbble are the primary platforms where clients find design talent. A strong Behance profile with 10 well-documented projects drives significant inbound inquiries","Pick a specialization: brand identity, packaging, social media graphics, or presentation design. Specialists earn 2 to 3 times more than generalists because clients perceive more relevant expertise","Show your design process, not just the final output. Clients want to see that you think strategically about design problems, not just produce aesthetically pleasing images"]}
  ],
  tools:[
{name:"Canva Pro",icon:"🎨",cat:"Design Tool",catColor:"rgba(255,202,44,0.12)",catTxt:"#C8841A",cost:"$13/mo",costType:"paid",steps:[
  "Go to <strong>canva.com</strong> and upgrade to Pro ($13/mo). Pro unlocks: Background Remover, Magic Resize, Brand Kits, 100M+ premium assets, and unlimited storage.",
  "Set up a <strong>Brand Kit</strong> for each client: go to Brand → Brand Kits → Add New. Upload their logo, enter hex color codes, and set their fonts.",
  "When designing for a client, go to <strong>Brand Kit</strong> panel and click their kit — all their colors and fonts are instantly available.",
  "Use <strong>Magic Resize</strong>: design a social post once, click Resize, select all the formats you need (Story, LinkedIn, Twitter Header). Canva resizes everything in seconds.",
  "Use <strong>Background Remover</strong>: upload any photo → Edit Image → Background Remover. Essential for product mockups and professional headshots.",
  "Create a <strong>Template Library</strong> for each client — save your designs as templates. This lets you (or your client) create new on-brand posts without starting from scratch."
]},
{name:"Figma",icon:"✏",cat:"Professional Design",catColor:"rgba(123,110,255,0.12)",catTxt:"#7B6EFF",cost:"Free tier",costType:"free",steps:[
  "Go to <strong>figma.com</strong> and sign up free. Create a new file for each client project.",
  "Set up your <strong>design system</strong> first: create Color Styles (client brand colors), Text Styles (heading sizes, body text), and Component library (buttons, cards, icons).",
  "Use <strong>Auto Layout</strong>: select a group of elements → Shift+A. Auto Layout makes your designs responsive — elements resize and reflow automatically.",
  "Use <strong>Variants</strong> for components with states: create a Button component with variants — Default, Hover, Disabled, Loading. Switch between states in prototypes.",
  "Present to clients: click <strong>Present (Cmd+Option+Enter)</strong>. Your prototype runs in fullscreen. Clients click through the design as if it were a real product.",
  "Hand off to developers: click <strong>Inspect tab</strong>. Developers see exact CSS values, spacing, and can copy code directly. No back-and-forth needed."
]},
{name:"Creative Market",icon:"🛒",cat:"Asset Marketplace",catColor:"rgba(255,45,107,0.12)",catTxt:"#CC2255",cost:"Per asset",costType:"paid",steps:[
  "Go to <strong>creativemarket.com</strong>. Browse fonts, templates, mockups, and graphics. Everything is licensed for commercial use.",
  "Search for <em>mockup</em> to find device and product mockups. Buy once, use on multiple client projects.",
  "Buy a <strong>font bundle</strong> (often on sale) — having 50+ quality fonts gives you more design variety than competitors using only free fonts.",
  "Purchase <strong>icon sets</strong> and <strong>illustration packs</strong> in your niche. Consistent illustration styles elevate any brand identity project.",
  "Check the <strong>Free Goods section</strong> every Monday — Creative Market offers 6 free premium assets every week. Download everything even if you do not need it immediately.",
  "To sell on Creative Market: go to <strong>Become a Shop Owner → Apply</strong>. Upload your templates, mockups, or fonts and earn 70% commission per sale."
]}
],
  actions:["Complete 3 real or concept design projects to populate your initial portfolio","Create profiles on Behance and Dribbble with your best work","Choose one platform to list your digital design products: Creative Market or Etsy","Reach out to 10 small businesses in your area or online offering a free design review","Set a goal of publishing one new digital product per week for the next 12 weeks to build passive income"],
  videos:[{t:"How to Start a Graphic Design Business in 2024",url:"https://www.youtube.com/results?search_query=graphic+design+business+2024+Roberto+Blake+2024",ch:"Roberto Blake"},{t:"Graphic Design Freelancing: Make Money with Design",url:"https://www.youtube.com/results?search_query=graphic+design+freelancing+money+design+Flux+Academy+2024",ch:"Flux Academy"}]
},

{id:34,tier:6,title:"Stock Market and ETF Investing",tagline:"Make your money work as hard as you do while you build your business",tag:"Investing",img:IMGS.chart,
  stats:[{l:"Startup Cost",v:"₦5k-₦50k"},{l:"Income Potential",v:"₦30k-₦500k/mo"},{l:"First Income",v:"6-24 months"},{l:"Difficulty",v:"Beginner"}],
  flow:[{l:"Earn Online Income",s:"From any other course"},{l:"Save and Invest",s:"Dollar-cost average"},{l:"Compound Returns",s:"Time does the work"},{l:"Financial Independence",s:"Money works for you"}],
  intro:"The stock market has returned an average of 10% annually over the last century. A $1,000 investment in an S&P 500 index fund in 2000 would be worth over $7,000 today with zero active management. This course is not about making you a day trader. It is about turning the income you build from your online business into lasting wealth through disciplined, consistent, long-term investing in proven assets.",
  lessons:[
    {t:"How the Stock Market Actually Works",pts:["When you buy a stock, you own a fractional piece of a real company. If the company grows more valuable, your share grows in value","An ETF (Exchange-Traded Fund) is a basket of stocks in one investment. The S&P 500 ETF (VOO or SPY) gives you exposure to the 500 largest US companies with one purchase","Dollar-Cost Averaging (DCA): invest a fixed amount weekly or monthly regardless of price. This removes emotion and ensures you automatically buy more when prices are low","The compound math: investing $500 per month at 10% annual return for 20 years grows to $343,000. Starting 10 years later with the same amount produces only $102,000. Time is the most powerful variable in investing"]},
    {t:"Building a Simple Wealth-Building Portfolio",pts:["Core holdings (80 to 90%): low-cost index ETFs. S&P 500 (VOO or SPY), Total Market (VTI), and international markets (VXUS). Hold these forever and add regularly","Satellite holdings (10 to 20%): individual stocks in companies you understand deeply and believe will continue growing for 10 or more years. Keep this percentage small and avoid frequent trading","Platforms accessible globally: Robinhood and Schwab for US residents, eToro for European and African investors, and Bamboo or Trove for Nigerian and other African market access","The most important investing rule: never invest money you need in the next 2 to 3 years. The market can decline 30 to 50% in any given year and requires a long horizon to recover and grow beyond those declines"]},
    {t:"Combining Business Income with Investing for Maximum Wealth",pts:["Set up automatic transfers of 20 to 30% of every online income payment directly to your investment account before you can spend it","Tax-advantaged accounts: in the US, max your Roth IRA ($7,000 per year) and SEP-IRA for self-employed individuals. These accounts grow tax-free","Reinvest dividends automatically. Over long periods, reinvested dividends account for a majority of total stock market returns","Business and investing together: at $5,000 per month business income, invest $1,500 per month (30%). Over 15 years at 10% growth, that builds to over $600,000 while your business income continues compounding separately"]}
  ],
  tools:[
{name:"Trading 212 / eToro",icon:"📈",cat:"Brokerage",catColor:"rgba(0,240,134,0.12)",catTxt:"#00C070",cost:"Free",costType:"free",steps:[
  "For non-US: go to <strong>trading212.com</strong> or <strong>etoro.com</strong>. Both allow investing in US stocks and ETFs internationally with zero commission.",
  "Download the app. Complete identity verification (government ID + proof of address). Approval takes 1 to 3 days.",
  "Deposit funds via bank transfer or card. Start with whatever amount you can afford to leave untouched for 5+ years.",
  "Search for <strong>VOO</strong> (Vanguard S&P 500 ETF) or <strong>VTI</strong> (Total US Market ETF). These are your core holdings. Click Buy.",
  "Set up <strong>Auto-Invest</strong> or a recurring buy: on Trading 212 go to <em>Pies → Create Pie</em>. Add your ETFs, set percentages, and enable AutoInvest with a monthly amount.",
  "Never check your portfolio daily. Monthly review is sufficient. The goal is to add money consistently and let compound growth work over years."
]},
{name:"Yahoo Finance",icon:"📊",cat:"Research & Tracking",catColor:"rgba(255,202,44,0.12)",catTxt:"#C8841A",cost:"Free",costType:"free",steps:[
  "Go to <strong>finance.yahoo.com</strong> or download the Yahoo Finance app. Create a free account.",
  "Go to <strong>My Portfolio → Create Portfolio</strong>. Add your holdings (symbol, shares, purchase price). Yahoo tracks your portfolio value in real time.",
  "Follow companies in your portfolio: click a stock → <strong>Follow</strong>. News about that company now appears in your personalized feed.",
  "Go to any stock page → <strong>Financials</strong> to see income statement, balance sheet, and cash flow. Focus on: Revenue growth (year over year), Net Income trend, and Debt levels.",
  "Use the <strong>Screener</strong> to find new investment ideas: filter by sector, P/E ratio, market cap, and dividend yield.",
  "Set up <strong>Price Alerts</strong>: click any stock → Bell icon. Get notified when a stock hits your target buy price. This removes emotion from entry decisions."
]},
{name:"Personal Capital / Empower",icon:"💰",cat:"Net Worth Tracking",catColor:"rgba(123,110,255,0.12)",catTxt:"#7B6EFF",cost:"Free",costType:"free",steps:[
  "Go to <strong>empower.com</strong> (formerly Personal Capital) and sign up free. Connect all your financial accounts: bank, brokerage, retirement, and crypto.",

],
  actions:["Open a brokerage account with a platform accessible in your country","Fund your account with even $50 to start. The habit matters more than the initial amount","Buy your first share of a broad market ETF: VOO, SPY, or VTI","Set up an automatic monthly transfer from your business income to your investment account","Read 'The Psychology of Money' by Morgan Housel to understand the behavioral side of long-term investing"],

},
{id:35,tier:6,title:"Crypto Fundamentals and Strategy",tagline:"Understand digital assets intelligently and invest with a clear strategy",tag:"Investing",img:IMGS.crypto,
  stats:[{l:"Startup Cost",v:"₦5k-₦200k"},{l:"Income Potential",v:"₦20k-₦1M/mo"},{l:"First Income",v:"Variable"},{l:"Difficulty",v:"Intermediate"}],
  flow:[{l:"Understand Fundamentals",s:"Blockchain and use cases"},{l:"Choose Strategy",s:"Long-term or active"},{l:"Secure Your Assets",s:"Hardware wallet"},{l:"Manage Risk",s:"Never more than you can lose"}],
  intro:"Cryptocurrency represents a genuine technological and financial paradigm shift, but it is also one of the highest-risk asset classes available. This course teaches you to participate intelligently: understanding what you own, why it has value, how to secure it properly, and how to manage the extreme volatility without making decisions based on emotion or social media noise. The goal is not overnight wealth but informed, rational participation in an asset class that has produced extraordinary long-term returns alongside extraordinary losses for the unprepared.",
  lessons:[
    {t:"Blockchain and Cryptocurrency Fundamentals",pts:["A blockchain is a distributed database where records are verified by a network of computers rather than a central authority like a bank. This makes transactions permissionless and transparent","Bitcoin was created as digital hard money: a fixed supply of 21 million coins that cannot be inflated, seized from a wallet only you control, or transacted without your cryptographic signature","Ethereum introduced programmable contracts that run automatically without intermediaries, enabling DeFi (decentralized finance), NFTs, and token-based applications","Different cryptocurrencies serve different purposes. Bitcoin as a store of value, Ethereum as programmable infrastructure, stablecoins as dollar equivalents for trading, and thousands of speculative tokens of varying quality"]},
    {t:"Investment Strategy and Risk Management",pts:["Position sizing is everything in crypto. No single crypto position should represent more than 5 to 10% of your total portfolio given the volatility and permanent loss risk","Bitcoin and Ethereum represent 60 to 70% of the total crypto market cap. For most investors, owning only these two simplifies the decision-making and reduces risk from individual project failures","Hardware wallets (Ledger, Trezor) are non-negotiable for any meaningful crypto holdings. Exchanges have been hacked. Your keys on a hardware wallet cannot be accessed by anyone but you","Tax implications: in most jurisdictions, crypto is taxed as property. Every trade, sale, or use of crypto to purchase something is a taxable event. Keep meticulous records or use a tool like Koinly to track your cost basis"]}
  ],
  tools:[
{name:"Coinbase",icon:"₿",cat:"Exchange",catColor:"rgba(255,202,44,0.12)",catTxt:"#C8841A",cost:"Free (trading fees)",costType:"free",steps:[
  "Go to <strong>coinbase.com</strong> and create an account. Complete KYC verification (ID + selfie). Approval usually within 24 hours.",
  "Go to <strong>Add Payment Method</strong>. Connect your bank account for low-fee transfers or use a debit card for instant buys (higher fee).",
  "Click <strong>Buy</strong>. Search Bitcoin (BTC) or Ethereum (ETH). Enter your amount. Review the fee and confirm. Start small — $50 to understand the process.",
  "Enable <strong>Recurring Buy</strong>: click your asset → Buy → Recurring. Set weekly or monthly auto-purchases. Dollar-cost averaging removes the stress of timing the market.",
  "Go to <strong>Settings → Security → Enable 2-Step Verification</strong> with an authenticator app (not SMS). This is critical — SMS 2FA can be SIM-swapped.",
  "Never leave large amounts on an exchange long-term. Exchanges get hacked. Transfer significant holdings to a hardware wallet (Ledger)."
]},
{name:"Ledger (Hardware Wallet)",icon:"🔒",cat:"Cold Storage",catColor:"rgba(0,229,255,0.12)",catTxt:"#00B8CC",cost:"$79 one-time",costType:"paid",steps:[
  "Order a <strong>Ledger Nano X</strong> from <strong>ledger.com only</strong> — never buy from third-party sellers (risk of tampered devices).",
  "When it arrives, install <strong>Ledger Live</strong> on your computer. Connect your Ledger via USB and follow the setup: choose a PIN and write down your 24-word seed phrase.",
  "Write your 24-word seed phrase on paper. Store it in a safe location separate from your Ledger device. This phrase is the only way to recover your funds if the device is lost.",
  "In Ledger Live click <strong>Add Account</strong>. Select Bitcoin and Ethereum. Install the respective apps on your Ledger device.",
  "To receive crypto: click <strong>Receive</strong> in Ledger Live. Verify the address shown on your Ledger screen matches the app before sending any funds.",
  "Never share your seed phrase with anyone. No legitimate service, support team, or application will ever ask for it."
]},
{name:"Koinly (Tax Tracking)",icon:"📊",cat:"Crypto Tax",catColor:"rgba(0,240,134,0.12)",catTxt:"#00C070",cost:"Free tier",costType:"free",steps:[
  "Go to <strong>koinly.io</strong> and create a free account. Koinly supports 700+ exchanges and wallets.",
  "Click <strong>Add Wallet</strong>. Choose your exchange (Coinbase, Binance, etc). Connect via API key or import CSV transaction history.",
  "Add your wallet addresses (Ledger, MetaMask) in the <strong>Wallets</strong> section. Koinly automatically detects all transactions.",
  "Koinly calculates your <strong>cost basis</strong> for every transaction using FIFO, LIFO, or HMRC method depending on your country.",
  "Go to <strong>Tax Reports</strong>. Koinly generates a complete tax report for your jurisdiction. Free plan shows your gains — paid plan downloads the official report.",
  "Check your <strong>Unrealized Gains</strong> dashboard to see your current profit/loss position across all holdings in real time."
]}
],
  actions:["Complete a structured course on blockchain fundamentals before investing any money","Purchase a hardware wallet and learn how to use it securely before holding significant amounts","Start with Bitcoin only for your first 3 months. Master the basics of custody and volatility management before diversifying","Track every transaction for tax purposes from day one using Koinly or CoinTracker","Set clear rules for yourself: maximum portfolio allocation, sell triggers, and under what conditions you will add to positions versus hold"],
  videos:[{t:"Crypto Investing for Beginners: Full Guide 2024",url:"https://www.youtube.com/results?search_query=crypto+investing+beginners+full+guide+Andrei+Jikh+2024",ch:"Andrei Jikh"},{t:"Bitcoin and Ethereum: How to Invest Safely 2024",url:"https://www.youtube.com/results?search_query=bitcoin+ethereum+invest+safely+2024+Coin+Bureau+2024",ch:"Coin Bureau"}]
},
{id:36,tier:6,title:"High Ticket Consulting and Coaching",tagline:"Get paid $1,000 to $25,000 to share expertise you already have",tag:"High Ticket",img:IMGS.people,
  stats:[{l:"Startup Cost",v:"₦0"},{l:"Income Potential",v:"₦500k-₦5M/mo"},{l:"First Income",v:"1-3 months"},{l:"Difficulty",v:"Advanced"}],
  flow:[{l:"Package Expertise",s:"Specific outcome promise"},{l:"Build Credibility",s:"Content and case studies"},{l:"Book Discovery Calls",s:"Diagnose and propose"},{l:"Close and Deliver",s:"Transformation and results"}],
  intro:"If you have meaningful results or experience in any area, someone will pay a premium for a direct line to your expertise. High-ticket coaching and consulting is one of the most direct paths to $10,000 per month because each client generates $1,000 to $10,000 or more. You need only 2 to 3 clients to reach life-changing income, and the path to those clients is far shorter than most people believe.",
  lessons:[
    {t:"Packaging Your Expertise as a High-Ticket Offer",pts:["The shift from low-ticket to high-ticket: from 'I teach marketing' to 'I help e-commerce founders who have reached $10k per month scale to $100k per month in 6 months using paid ads and systems'","Specificity is the pricing mechanism. The more precisely you define who you help, what outcome they get, and in what timeframe, the higher you can charge and the easier it becomes to sell","Price anchoring: a 3-month program at $3,000 feels expensive until it is compared to the $30,000 per month in additional revenue the client is trying to generate. Always present your price alongside the outcome's value","Guarantee structures: offering a satisfaction guarantee or results-based guarantee removes risk from the buyer and signals confidence in your ability to deliver. Use them whenever possible"]},
    {t:"Getting Clients Without a Large Audience",pts:["Warm network first: identify 20 people who could benefit from your expertise or who know people who could. Reach out personally, not with a sales pitch, but with genuine curiosity about their challenges","Discovery calls: invite potential clients to a free 45-minute clarity call where you diagnose their situation and present a tailored proposal. This is not a pitch, it is a consultation. Well-run discovery calls convert at 20 to 40%","LinkedIn personal brand: post consistently about the transformations you create and the specific results you have produced. Decision-makers are reading LinkedIn and they reach out when they recognize their own challenge in your content","Referrals: ask every satisfied client for one specific introduction. 'Do you know one other person who faces the challenge we worked on together?' Referral clients close faster and at higher rates than any cold acquisition channel"]}
  ],
  tools:[
{name:"Calendly",icon:"📅",cat:"Booking",catColor:"rgba(0,240,134,0.12)",catTxt:"#00C070",cost:"Free tier",costType:"free",steps:[
  "Go to <strong>calendly.com</strong> and sign up free. Connect your Google Calendar or Outlook.",
  "Click <strong>+ New Event Type → One-on-One</strong>. Name it: <em>Free 30-Min Strategy Session</em>. Set duration to 30 minutes.",
  "Under <strong>Questions</strong> add qualifying fields: <em>What is your biggest challenge right now?</em>, <em>What is your monthly revenue?</em>, <em>What have you already tried?</em>. This filters serious prospects only.",
  "Under <strong>Notifications</strong> enable email reminders at 24 hours and 1 hour before the call. This cuts no-shows by 60%.",
  "Add your Calendly link to your LinkedIn bio, email signature, and at the end of every content piece: <em>Book a free strategy call here.</em>",
  "After every call send a follow-up email within 2 hours with a summary of what you discussed and your proposal or next step. Speed here directly impacts conversion rate."
]},
{name:"Notion (Client Delivery)",icon:"📋",cat:"Client Portal",catColor:"rgba(255,202,44,0.12)",catTxt:"#C8841A",cost:"Free",costType:"free",steps:[
  "Go to <strong>notion.so</strong>. Create a <strong>Client Portal Template</strong> — duplicate this for every new client.",
  "Inside each client portal include: Welcome message, Program Overview, Weekly Call Schedule, Resource Library, Action Items (updated weekly), and Progress Tracking.",
  "Create a <strong>Consulting Delivery Database</strong>: columns for Client Name, Start Date, End Date, Monthly Retainer, Sessions Completed, Next Session Date, Status.",
  "After every consulting call update the client portal with: session summary, key decisions made, action items for the client, and your recommendations.",
  "Share the portal: <strong>Share → Anyone with link → Can View</strong>. Clients can access their portal anytime to review materials and track progress.",
  "Use Notion to build your <strong>Consulting Methodology</strong>: document your framework, templates, and processes. This is your intellectual property and justifies your premium price."
]},
{name:"Loom (Async Consulting)",icon:"🎥",cat:"Video Delivery",catColor:"rgba(255,45,107,0.12)",catTxt:"#CC2255",cost:"Free tier",costType:"free",steps:[
  "Go to <strong>loom.com</strong> and install the desktop app. Free plan: unlimited videos up to 5 minutes.",
  "Use Loom to deliver audit reviews: screen-record yourself walking through a client's website, funnel, or strategy document with live commentary.",
  "Structure every Loom audit: <em>Here is what is working → Here is what needs to change → Here is exactly how to fix it → Here are your action items.</em>",
  "Send a Loom after every coaching call as a summary: <em>Here are the 3 things we covered today and your specific next steps.</em> This adds massive perceived value.",
  "Build a <strong>resource video library</strong> for clients: record short Loom explainers on common topics your clients ask about. Send the relevant link instead of re-explaining.",
  "Check <strong>Loom Analytics</strong> to see which clients watched the video. If a client did not watch their homework video before the next call, you know immediately."
]}
],
  actions:["Write a one-paragraph description of your ideal client, the outcome you create, and the timeframe. This is the foundation of your entire positioning","Set your pricing based on the value of the outcome you deliver, not on your hourly rate or the time you invest","Create a simple landing page for your coaching or consulting offer with a discovery call booking link","Post 3 times per week on LinkedIn sharing insights and results related to your expertise","Book 10 discovery calls in your first 30 days regardless of whether you feel ready. The conversations will reveal exactly how to refine your offer"],
  videos:[{t:"High Ticket Consulting: How to Charge Premium Prices",url:"https://www.youtube.com/results?search_query=high+ticket+consulting+charge+premium+Alex+Hormozi+2024",ch:"Alex Hormozi"},{t:"How to Start a Consulting Business in 2024",url:"https://www.youtube.com/results?search_query=consulting+business+2024+Sam+Ovens+2024",ch:"Sam Ovens"}]
},
{id:37,tier:6,title:"Real Estate Investing Online",tagline:"Build generational wealth through property without traditional barriers",tag:"Investing",img:IMGS.people,
  stats:[{l:"Startup Cost",v:"₦10k-₦1M"},{l:"Income Potential",v:"₦100k-₦2M/mo"},{l:"First Income",v:"6-24 months"},{l:"Difficulty",v:"Advanced"}],
  flow:[{l:"Learn the Market",s:"Study before you buy"},{l:"Choose Strategy",s:"Flip, rent, or REIT"},{l:"Fund Your Deal",s:"Cash, mortgage, or partner"},{l:"Build Portfolio",s:"Compound through reinvestment"}],
  intro:"Real estate has created more millionaires than any other asset class in history. The barrier to entry has been lowered significantly by fractional investing platforms, REITs, and online tools that allow you to analyze deals remotely. For those with sufficient capital, direct property investment generates rental income, appreciation, tax advantages, and the ability to use leverage to amplify returns. For those starting out, REITs and crowdfunding platforms offer exposure without the large capital requirements.",
  lessons:[
    {t:"Real Estate Investment Strategies Ranked by Startup Capital",pts:["REITs (Real Estate Investment Trusts): invest in real estate through the stock market with as little as $50. Similar returns to direct property with none of the management complexity","Real estate crowdfunding platforms: Fundrise and CrowdStreet allow you to invest in commercial and residential projects with $500 to $5,000. Passive income without property management","House hacking: buy a multi-unit property, live in one unit, and rent the others. The rental income covers or exceeds your mortgage, allowing you to live for free while building equity","Buy and hold rental properties: the traditional real estate wealth-building model. Requires significant capital (20% down payment) but generates monthly cash flow, appreciation, and tax deductions simultaneously"]},
    {t:"Analyzing Real Estate Deals Online",pts:["Cash-on-cash return: annual pre-tax cash flow divided by total cash invested. Aim for 8 to 12% minimum in most markets for a deal to make financial sense","Cap rate: net operating income divided by property purchase price. Indicates the income-generating potential of a property independent of financing","Tools for remote deal analysis: Roofstock for turnkey rental properties, Mashvisor for market analysis, Zillow for comparable sales, and Rentometer for rental rate research","The 1% rule: monthly rent should be at least 1% of the total property cost. A $150,000 property should rent for at least $1,500 per month to potentially cash flow positively"]}
  ],
  tools:[
{name:"Fundrise",icon:"🏠",cat:"Real Estate Investing",catColor:"rgba(255,202,44,0.12)",catTxt:"#C8841A",cost:"$10 minimum",costType:"paid",steps:[
  "Go to <strong>fundrise.com</strong> and create an account. Available to US residents. Minimum investment: $10.",
  "Choose your <strong>investment plan</strong>: Supplemental Income (quarterly dividends), Balanced Investing (growth + income), or Long-Term Growth (maximum appreciation).",
  "Fund your account via bank transfer. Fundrise invests your money across a diversified portfolio of commercial and residential real estate projects.",
  "Go to <strong>Dashboard → Portfolio</strong> to see your current holdings, current value, and all earned dividends.",
  "Enable <strong>Auto-Invest</strong>: set a monthly contribution amount. Fundrise automatically adds your funds to your selected plan each month.",
  "Understand the liquidity: Fundrise is not liquid like stocks. You can request redemptions quarterly. Only invest money you do not need for 5+ years."
]},
{name:"Zillow / Rentometer",icon:"📍",cat:"Property Research",catColor:"rgba(0,229,255,0.12)",catTxt:"#00B8CC",cost:"Free",costType:"free",steps:[
  "Go to <strong>zillow.com</strong> for property research. Search any city and use filters: For Sale, price range, bedrooms, and property type.",
  "On any listing check: <strong>Zestimate</strong> (estimated market value), price history, days on market, and neighborhood median prices.",
  "Use <strong>Zillow's Rent Zestimate</strong> on any property to estimate potential rental income if you convert it to a rental.",
  "Go to <strong>rentometer.com</strong>. Enter the property address and unit type. Rentometer shows average, median, and percentile rents for comparable properties nearby.",
  "Calculate your <strong>cap rate</strong>: Annual Net Income ÷ Purchase Price. A cap rate above 6% in most markets is considered a good return.",
  "Use <strong>BiggerPockets Rental Property Calculator</strong> (biggerpockets.com/rental-property-calculator): input purchase price, rent, expenses, and financing to get detailed cash flow projections."
]},
{name:"BiggerPockets",icon:"🏢",cat:"Education & Community",catColor:"rgba(0,240,134,0.12)",catTxt:"#00C070",cost:"Free",costType:"free",steps:[
  "Go to <strong>biggerpockets.com</strong> and create a free account. The largest real estate investing community in the world.",
  "Go to <strong>Forums</strong> and search your specific market or strategy. Read threads about the exact deals, problems, and approaches other investors are using.",
  "Use the <strong>BiggerPockets Podcast</strong>: search for episodes about your investing strategy (house hacking, BRRRR, short-term rentals). These are 60-minute deep dives with real investors.",
  "Use the free <strong>Calculators</strong>: Rental Property, Fix and Flip, BRRRR, and Wholesaling calculators. Run the numbers on every deal before making any offer.",
  "Connect with local investors in your market: go to <strong>Community → Find Members → filter by location</strong>. Local connections lead to off-market deals and partnership opportunities.",
  "Read the free <strong>BiggerPockets Guides</strong> on your strategy. They cover house hacking, long-distance investing, and commercial real estate in plain language."
]}
],
  actions:["Read 'The ABCs of Real Estate Investing' by Ken McElroy to build fundamental knowledge","Start with a REIT or Fundrise investment to understand real estate returns while building capital","Join BiggerPockets community and listen to 20 podcast episodes from investors in your target market","Analyze 3 real deals using the cash-on-cash and cap rate formulas before investing any money","Identify your target market based on rental demand, price-to-rent ratios, and population growth trends"],
  videos:[{t:"Real Estate Investing for Beginners with No Money 2024",url:"https://www.youtube.com/results?search_query=real+estate+investing+beginners+no+Andrei+Jikh+2024",ch:"Andrei Jikh"},{t:"How to Invest in Real Estate Online 2024",url:"https://www.youtube.com/results?search_query=invest+real+estate+online+2024+Graham+Stephan+2024",ch:"Graham Stephan"}]
},

{id:38,tier:7,title:"Personal Branding and Thought Leadership",tagline:"Become the go-to person in your space and multiply every other income stream",tag:"Brand",img:IMGS.brand,
  stats:[{l:"Startup Cost",v:"₦0"},{l:"Income Potential",v:"₦100k-₦2M/mo"},{l:"First Income",v:"3-9 months"},{l:"Difficulty",v:"Intermediate"}],
  flow:[{l:"Define Your POV",s:"What you uniquely believe"},{l:"Create Content",s:"Consistent and distinctive"},{l:"Build Authority",s:"Audience trusts you"},{l:"Monetize Anywhere",s:"Everything converts better"}],
  intro:"A strong personal brand is the multiplier that makes every other income stream in this program generate more. When people know, like, and trust you before you even speak to them, sales become conversations. Opportunities find you. Your content travels further. A personal brand is not vanity. It is business infrastructure that takes time to build but pays dividends indefinitely once established.",
  lessons:[
    {t:"Building Your Brand DNA: The 3-Part Foundation",pts:["Point of View: what do you believe that others in your space do not? Conviction is magnetic. Safe, middle-of-the-road opinions attract no one","Story: what is the journey that makes your perspective credible and relatable? Your transformation story is your most powerful brand asset","Expertise: what specific result can you consistently help people achieve? The more concrete and measurable, the stronger the positioning","The most powerful brands are intentionally polarizing: they attract a passionate audience by taking a clear stand. 'Productivity advice is mostly broken. Here is what actually works for entrepreneurs.' outperforms 'Here are 5 tips to be more productive' every single time"]},
    {t:"Content Strategy for Building Thought Leadership",pts:["Publish consistently on one platform for 90 days before expanding. Depth builds algorithm momentum and audience trust faster than spreading thin across many platforms","Content mix: 60% educational and value-adding, 20% personal story and vulnerability, 10% engagement and conversation-starting, 10% direct offers","Document your journey in real time. Building in public: sharing your actual results, failures, and pivots generates far more authentic content than polished advice and builds a community around your progress","Repurpose everything: one long-form piece, whether a video, article, or podcast episode, should produce 10 or more short-form pieces across platforms"]},
    {t:"Leveraging Your Brand for Multiple Income Streams",pts:["Every income stream in this program performs better with an established personal brand behind it. Affiliate recommendations convert at higher rates, consulting clients pay more, courses sell faster, and brand deals find you rather than you finding them","Speaking opportunities: a recognizable personal brand in your niche can command $1,000 to $20,000 per speaking engagement at conferences, corporate events, and online summits","Book deal or self-published book: a book is the ultimate credibility asset. It opens doors to media, corporate speaking, and high-ticket consulting that no other content format matches","Partnership and collaboration income: brands, tools, and organizations in your niche will pay for access to your audience once you have established genuine authority in the space"]}
  ],
  tools:[
{name:"Canva (Brand Identity)",icon:"🎨",cat:"Brand Design",catColor:"rgba(255,202,44,0.12)",catTxt:"#C8841A",cost:"Free / $13/mo",costType:"free",steps:[
  "Go to <strong>canva.com → Brand Kit → Create New Brand Kit</strong>. Set: primary color, secondary color, accent color, heading font, and body font.",
  "Design your <strong>profile photo background</strong>: create a simple 800x800px card in your brand color with your name in the bottom corner. Use this as LinkedIn and Twitter header area.",
  "Create your <strong>content templates</strong>: make 5 reusable post templates — quote card, tip card, stat card, story card, and promotional card. All in your brand colors.",
  "Design your <strong>link in bio page</strong> using Canva's website builder. Add your photo, headline, and buttons linking to your products, newsletter, and booking page.",
  "Create a <strong>media kit</strong>: a one-page PDF with your bio, audience stats, topics you speak on, and contact info. Send this to podcast hosts and brand partners.",
  "Consistency is everything — same profile photo, same color scheme, and same font across every platform. Recognizability builds trust faster than any other signal."
]},
{name:"Beehiiv (Newsletter)",icon:"🐝",cat:"Newsletter Platform",catColor:"rgba(0,229,255,0.12)",catTxt:"#00B8CC",cost:"Free to 2.5k subs",costType:"free",steps:[
  "Go to <strong>beehiiv.com</strong> and sign up free. Choose your publication name — make it either your name or a brand keyword.",
  "Go to <strong>Design → Customize</strong>. Upload your logo, set brand colors, choose your layout. Keep it clean — one column, lots of white space.",
  "Write your first issue. Structure: hook sentence → main insight (300 to 500 words) → one actionable takeaway → CTA to share or buy.",
  "Set your <strong>publish schedule</strong> and stick to it. Weekly on the same day outperforms sporadic publishing every time. Consistency builds anticipation.",
  "Go to <strong>Grow → Referral Program</strong>. Set rewards for subscribers who refer others: e.g. 3 referrals = exclusive resource, 10 referrals = free consulting call.",
  "Go to <strong>Monetize</strong>. Once you hit 1,000 subscribers enable the <strong>Beehiiv Ad Network</strong> — advertisers pay per impression automatically."
]},
{name:"ConvertKit / Kit",icon:"✉",cat:"Email List",catColor:"rgba(255,45,107,0.12)",catTxt:"#CC2255",cost:"Free to 1k subs",costType:"free",steps:[
  "Go to <strong>kit.com</strong> and sign up free. Connect your website or social bio link.",
  "Create a <strong>Lead Magnet</strong>: a free PDF, template, or mini-course that solves one specific problem for your target audience. Give it away in exchange for an email.",
  "Build a <strong>Landing Page</strong>: click Grow → Landing Pages → Create New. Headline = the outcome of your lead magnet. Keep it to: headline, 3 bullet points, email form.",
  "Create an <strong>Automation</strong>: trigger = subscriber joins. Email 1 (day 0): deliver the lead magnet. Email 2 (day 2): your story. Email 3 (day 4): your best content. Email 4 (day 7): your offer.",
  "Tag subscribers based on what they click. If they click a link about topic X, tag them as interested in X. Use tags to send more relevant content.",
  "Your email list is your most valuable asset — it is the one audience you own completely. Social platforms can change algorithms or ban accounts; your list cannot be taken away."
]}
],
  actions:["Write your brand statement: 'I help [specific person] achieve [specific outcome] in [specific timeframe] using [your method]'","Choose one primary platform and commit to posting at least 3 times per week for 90 consecutive days","Document and share one result or learning from your work every single week without exception","Create a simple email list and begin growing it alongside your social presence from day one","Reach out to 5 people in your niche for collaboration, conversation, or content partnership every week"],
  videos:[{t:"How to Build a Personal Brand in 2024 - Full Guide",url:"https://www.youtube.com/results?search_query=personal+brand+2024+full+guide+Pat+Flynn+2024",ch:"Pat Flynn"},{t:"Personal Branding: From Zero to Authority 2024",url:"https://www.youtube.com/results?search_query=personal+branding+zero+authority+2024+Gary+Vaynerchuk+2024",ch:"Gary Vaynerchuk"}]
},
{id:39,tier:7,title:"Sales Funnels and Conversion Optimization",tagline:"The system that turns traffic into buyers automatically while you sleep",tag:"Growth",img:IMGS.laptop,

// ── UTILITIES ────────────────────────────────────────────────
var tierColor = id => TIERS.find(t=>t.id===id)?.color||'#FFCA2C';
var tierName = id => TIERS.find(t=>t.id===id)?.name||'';
var imgUrl = id => `https://images.unsplash.com/photo-${id}?w=900&h=450&fit=crop&auto=format&q=80`;

// ── SAFE STORAGE ─────────────────────────────────────────────
var completed = [];
try { completed = JSON.parse(localStorage.getItem('360ffp-done')||'[]'); } catch(e){}
var saveDone = () => { try { localStorage.setItem('360ffp-done',JSON.stringify(completed)); } catch(e){} };

var markDone = id => {
  if(!completed.includes(id)) completed.push(id);
  saveDone();
  updateProgress();
};
var updateProgress = () => {
  var p = Math.round((completed.length/40)*100);
  var bar = document.getElementById('progressBar');
  if(bar) bar.style.width = p+'%';
  var np = document.getElementById('navProg');
  if(np) np.textContent = completed.length+' / 40';
  var m = document.getElementById('mobProg');
  if(m) m.textContent = completed.length+'/40';
};

var showToast = msg => {
  var t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
};

// ── ROUTER (hash-only, works on file:// and content://) ───────
var goHome = () => { location.hash = ''; render(); window.scrollTo(0,0); };
var goCourse = id => { location.hash = 'course-'+id; };
window.addEventListener('hashchange', () => { render(); window.scrollTo(0,0); });

function render(){
  try {
    var h = location.hash.replace('#','');
    if(h.startsWith('course-')){
      var id = parseInt(h.split('-')[1]);
      if(id>=1&&id<=40){ renderCourse(id); }
      else { renderHome(); }
    } else {
      renderHome();
    }
    updateProgress();
  } catch(err){
    console.error('Render error:',err);
    document.getElementById('app').innerHTML = '<div style="color:#fff;padding:40px;text-align:center"><h2>Loading...</h2><p style="color:#666;margin-top:12px">'+err.message+'</p></div>';
  }
}

function hideGate(){
  var go = document.getElementById('gateOverlay');
  if(!go) return;
  go.style.cssText = 'display:none!important;visibility:hidden;opacity:0;pointer-events:none;';
