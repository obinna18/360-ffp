<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 6-Figure Digital Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,800;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════
   6-FIGURE DIGITAL PLAYBOOK  ·  v5  ·  Light Edition
   Clean, warm, editorial. White surfaces, amber soul.
══════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  /* Backgrounds */
  --bg:#F5F3EE;
  --bg2:#EFEDE8;
  --surface:#FFFFFF;
  --surface2:#FAFAF8;
  /* Borders */
  --border:#E4E1D9;
  --border2:#EDE9E2;
  /* Text */
  --txt:#1C1917;
  --txt2:#44403C;
  --muted:#A8A29E;
  /* Accent: warm amber-gold */
  --gold:#D97706;
  --gold-light:#FFFBEB;
  --gold-mid:#FDE68A;
  --gold-border:#FCD34D;
  --gold-btn:#F59E0B;
  /* Support colors */
  --green:#16A34A;
  --green-light:#F0FDF4;
  --green-border:#BBF7D0;
  --rose:#E11D48;
  --rose-light:#FFF1F2;
  --blue:#2563EB;
  --blue-light:#EFF6FF;
  /* Tier accents */
  --t1:#D97706;--t2:#E11D48;--t3:#16A34A;--t4:#7C3AED;
  --t5:#EA580C;--t6:#0284C7;--t7:#E11D48;
  /* Shadows */
  --shadow-xs:0 1px 2px rgba(0,0,0,0.05);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.07),0 1px 2px rgba(0,0,0,0.04);
  --shadow:0 4px 16px rgba(0,0,0,0.08),0 1px 4px rgba(0,0,0,0.04);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.10),0 4px 12px rgba(0,0,0,0.05);
  /* Radii */
  --r:14px;--r-sm:9px;--r-lg:20px;--r-xl:28px;
}
html{scroll-behavior:smooth;font-size:17px;}
body{
  background:var(--bg);color:var(--txt);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--muted);}

/* ── NAV ────────────────────────────── */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:0 28px;height:62px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow-xs);
}
.nav-logo{
  font-family:'Fraunces',serif;font-size:18px;font-weight:900;
  color:var(--txt);cursor:pointer;letter-spacing:-0.3px;
  display:flex;align-items:center;gap:10px;
}
.nav-logo-icon{
  width:32px;height:32px;
  background:linear-gradient(135deg,var(--gold-btn),#B45309);
  border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:15px;color:#fff;flex-shrink:0;
  box-shadow:0 2px 8px rgba(245,158,11,0.35);
}
.nav-logo span{color:var(--gold);}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-link{
  font-size:13px;font-weight:500;color:var(--txt2);
  cursor:pointer;padding:7px 14px;border-radius:var(--r-sm);transition:all .15s;
}
.nav-link:hover{background:var(--bg);color:var(--txt);}
.nav-prog{
  font-size:12px;font-weight:700;color:var(--gold);
  padding:5px 14px;background:var(--gold-light);
  border:1px solid var(--gold-border);border-radius:20px;
  font-family:'JetBrains Mono',monospace;
}
.nav-logout-btn{
  font-size:12px;font-weight:600;color:var(--rose);
  cursor:pointer;padding:7px 13px;border-radius:var(--r-sm);
  border:1px solid rgba(225,29,72,0.2);background:var(--rose-light);
  transition:all .15s;
}
.nav-logout-btn:hover{background:#FFE4E6;}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:6px;}
.hamburger span{display:block;width:22px;height:2px;background:var(--txt2);border-radius:2px;}
.mobile-menu{
  display:none;position:fixed;top:62px;left:0;right:0;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:12px 16px;z-index:199;flex-direction:column;gap:2px;
  box-shadow:var(--shadow);
}
.mobile-menu.open{display:flex;}
.mobile-link{font-size:15px;padding:13px 16px;color:var(--txt2);cursor:pointer;border-radius:var(--r-sm);transition:background .15s;}
.mobile-link:hover{background:var(--bg);color:var(--txt);}

/* ── PROGRESS BAR ── */
.progress-wrap{position:fixed;top:62px;left:0;right:0;height:3px;background:var(--border2);z-index:199;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--gold-btn),#D97706);transition:width .5s ease;border-radius:0 3px 3px 0;}

/* ── APP ── */
#app{padding-top:65px;}
.view{animation:fadeUp .3s cubic-bezier(.16,1,.3,1);}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

/* ── GATE SCREEN ── */
.gate-overlay{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.gate-page{
  width:100%;max-width:460px;
  display:flex;flex-direction:column;align-items:center;gap:0;
}
.gate-top{
  background:linear-gradient(135deg,#FEF3C7 0%,#FDE68A 40%,#FCD34D 100%);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:40px 40px 36px;
  width:100%;text-align:center;
  border:1px solid var(--gold-border);border-bottom:none;
  position:relative;overflow:hidden;
}
.gate-top::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:160px;height:160px;
  background:radial-gradient(circle,rgba(255,255,255,0.5) 0%,transparent 70%);
  pointer-events:none;
}
.gate-icon{
  width:64px;height:64px;
  background:#fff;border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;margin:0 auto 16px;
  box-shadow:0 4px 20px rgba(180,83,9,0.2);
}
.gate-brand{
  font-family:'Fraunces',serif;font-size:24px;font-weight:900;
  color:var(--txt);letter-spacing:-0.5px;line-height:1.15;
  margin-bottom:6px;
}
.gate-brand em{color:#92400E;font-style:italic;}
.gate-tagline{font-size:13px;color:#78350F;font-weight:500;line-height:1.5;}
.gate-bottom{
  background:var(--surface);
  border-radius:0 0 var(--r-xl) var(--r-xl);
  padding:36px 40px 40px;
  width:100%;
  border:1px solid var(--border);border-top:none;
  box-shadow:var(--shadow-lg);
}
.gate-label{
  font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;
}
.gate-sub{font-size:14px;color:var(--txt2);line-height:1.65;margin-bottom:20px;}
.gate-input{
  width:100%;padding:14px 18px;
  background:var(--bg);
  border:1.5px solid var(--border);
  border-radius:var(--r-sm);
  color:var(--txt);font-size:16px;font-weight:700;
  font-family:'JetBrains Mono',monospace;
  letter-spacing:3px;text-align:center;
  transition:border-color .2s,box-shadow .2s,background .2s;
  outline:none;margin-bottom:12px;
}
.gate-input::placeholder{color:var(--muted);letter-spacing:2px;font-weight:400;font-size:13px;}
.gate-input:focus{
  border-color:var(--gold-btn);background:var(--surface);
  box-shadow:0 0 0 3px rgba(245,158,11,0.15);
}
.gate-btn{
  width:100%;padding:15px;
  background:linear-gradient(135deg,#F59E0B,#D97706);
  color:#fff;font-weight:800;font-size:15px;
  border:none;border-radius:var(--r-sm);cursor:pointer;
  letter-spacing:.3px;transition:all .2s;
  box-shadow:0 4px 16px rgba(217,119,6,0.4);
}
.gate-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(217,119,6,0.5);}
.gate-btn:active{transform:none;}
.gate-err{font-size:13px;color:var(--rose);margin-top:10px;min-height:18px;font-weight:500;text-align:center;}
.gate-footer{font-size:13px;color:var(--muted);margin-top:20px;text-align:center;}
.gate-footer a{color:var(--gold);font-weight:700;border-bottom:1px solid var(--gold-border);transition:all .15s;padding-bottom:1px;}
.gate-footer a:hover{color:var(--txt);border-color:var(--txt);}

/* ── HOME HERO ── */
.hero{
  padding:60px 28px 52px;
  max-width:720px;margin:0 auto;text-align:center;
}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--gold-light);border:1px solid var(--gold-border);
  color:var(--gold);font-size:11px;font-weight:700;
  letter-spacing:2.5px;text-transform:uppercase;
  padding:7px 18px;border-radius:20px;margin-bottom:28px;
}
.hero h1{
  font-family:'Fraunces',serif;
  font-size:clamp(36px,5.5vw,56px);
  font-weight:900;line-height:1.1;letter-spacing:-1.5px;
  color:var(--txt);margin-bottom:18px;
}
.hero h1 em{color:var(--gold);font-style:italic;}
.hero-sub{
  font-size:17px;color:var(--txt2);
  max-width:520px;margin:0 auto 36px;line-height:1.75;font-weight:400;
}
.hero-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:48px;}
.btn-primary{
  background:linear-gradient(135deg,#F59E0B,#D97706);
  color:#fff;font-weight:800;font-size:15px;
  padding:14px 32px;border-radius:var(--r-sm);
  cursor:pointer;border:none;letter-spacing:.2px;
  transition:all .2s;box-shadow:0 4px 16px rgba(217,119,6,0.35);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(217,119,6,0.45);}
.btn-outline{
  background:var(--surface);color:var(--txt);font-weight:600;font-size:15px;
  padding:14px 32px;border-radius:var(--r-sm);
  cursor:pointer;border:1.5px solid var(--border);transition:all .2s;
}
.btn-outline:hover{border-color:var(--muted);background:var(--bg);}
.hero-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:440px;margin:0 auto;
}
.hero-stat{
  background:var(--surface);border:1px solid var(--border);
  padding:20px 14px;border-radius:var(--r);text-align:center;
  box-shadow:var(--shadow-sm);transition:all .2s;
}
.hero-stat:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--gold-border);}
.hero-stat strong{
  display:block;font-family:'Fraunces',serif;
  font-size:28px;font-weight:900;color:var(--gold);margin-bottom:6px;
}
.hero-stat span{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-weight:600;}

/* ── SELAR BANNER ── */
.selar-banner{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:var(--surface);border:1px solid var(--border);
  border-left:4px solid var(--gold-btn);
  border-radius:var(--r);padding:18px 22px;margin-bottom:8px;
  box-shadow:var(--shadow-sm);
}
.selar-text strong{
  font-family:'Fraunces',serif;font-size:15px;font-weight:700;
  color:var(--txt);display:block;margin-bottom:3px;
}
.selar-text p{font-size:13px;color:var(--txt2);line-height:1.5;}
.selar-btn{
  background:linear-gradient(135deg,#F59E0B,#D97706);
  color:#fff;font-weight:800;font-size:13px;
  padding:10px 22px;border-radius:var(--r-sm);
  cursor:pointer;border:none;white-space:nowrap;
  text-decoration:none;transition:all .2s;
  box-shadow:0 3px 10px rgba(217,119,6,0.3);flex-shrink:0;
}
.selar-btn:hover{transform:translateY(-1px);}

/* ── SECTION & DIVIDER ── */
.section{padding:36px 24px 20px;max-width:1180px;margin:0 auto;}
.divider-line{width:100%;height:1px;background:var(--border);margin:28px 0;}

/* ── TIER HEADER ── */
.tier-header{position:relative;padding-left:68px;min-height:60px;margin-bottom:24px;}
.tier-num{
  position:absolute;left:0;top:-6px;
  font-family:'Fraunces',serif;font-size:52px;font-weight:900;line-height:1;
  color:rgba(0,0,0,0.04);user-select:none;
}
.tier-badge{
  font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  padding:4px 12px;border-radius:20px;display:inline-block;margin-bottom:6px;
}
.tier-title{font-family:'Fraunces',serif;font-size:20px;font-weight:800;color:var(--txt);}
.tier-desc{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5;}

/* ── COURSE GRID ── */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}

/* ── COURSE CARD ── */
.c-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;cursor:pointer;
  transition:all .25s cubic-bezier(.16,1,.3,1);
  box-shadow:var(--shadow-sm);
}
.c-card:hover{
  transform:translateY(-4px);box-shadow:var(--shadow-lg);
  border-color:transparent;
}
.card-img-wrap{height:148px;overflow:hidden;position:relative;background:var(--bg2);}
.card-img{width:100%;height:100%;object-fit:cover;transition:transform .5s;}
.c-card:hover .card-img{transform:scale(1.06);}
.card-img-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(28,25,23,0.55) 0%,transparent 55%);}
.card-num{
  position:absolute;top:10px;left:12px;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
  color:rgba(255,255,255,0.85);
  background:rgba(0,0,0,0.3);
  padding:3px 8px;border-radius:6px;backdrop-filter:blur(4px);
}
.card-tier{
  position:absolute;top:10px;right:10px;
  font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  padding:3px 9px;border-radius:20px;backdrop-filter:blur(8px);
}
.card-done-check{
  position:absolute;bottom:10px;right:10px;
  width:24px;height:24px;border-radius:50%;
  background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(22,163,74,0.4);
}
.card-body{padding:16px 18px 18px;}
.card-title{
  font-family:'Fraunces',serif;font-size:15px;font-weight:700;
  color:var(--txt);margin-bottom:5px;line-height:1.35;
}
.card-tagline{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:14px;}
.card-footer{display:flex;align-items:center;justify-content:space-between;}
.card-tag{
  font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding:4px 10px;border-radius:20px;
}
.card-arrow{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;border:1.5px solid var(--border);
  color:var(--muted);transition:all .2s;
}
.c-card:hover .card-arrow{border-color:var(--gold-btn);color:var(--gold);}

/* ── MODULE HERO ── */
.mod-hero{position:relative;height:230px;overflow:hidden;background:var(--bg2);}
.mod-hero-img{width:100%;height:100%;object-fit:cover;filter:brightness(0.75) saturate(0.8);}
.mod-hero-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(28,25,23,0.88) 0%,rgba(28,25,23,0.2) 55%,transparent 100%);
}
.mod-hero-content{position:absolute;bottom:0;left:0;right:0;padding:24px 28px 22px;}
.mod-breadcrumb{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:600;color:rgba(255,255,255,0.7);
  background:rgba(255,255,255,0.1);
  padding:5px 12px;border-radius:20px;
  margin-bottom:12px;cursor:pointer;
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);
  transition:all .15s;
}
.mod-breadcrumb:hover{background:rgba(255,255,255,0.18);color:#fff;}
.mod-num{
  position:absolute;top:16px;right:22px;
  font-family:'Fraunces',serif;font-size:64px;font-weight:900;
  color:rgba(255,255,255,0.07);line-height:1;user-select:none;
}
.mod-title{
  font-family:'Fraunces',serif;font-size:clamp(21px,4vw,28px);
  font-weight:900;color:#fff;line-height:1.15;margin-bottom:8px;
}
.mod-tagline{font-size:14px;color:rgba(255,255,255,0.7);margin-bottom:12px;line-height:1.5;}
.mod-tags{display:flex;gap:6px;flex-wrap:wrap;}
.mod-tag{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:4px 12px;border-radius:20px;}

/* ── TABS ── */
.tabs{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 24px;display:flex;gap:0;overflow-x:auto;
  scrollbar-width:none;position:sticky;top:62px;z-index:50;
  box-shadow:0 1px 0 var(--border);
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  font-size:13px;font-weight:600;color:var(--muted);
  padding:16px 18px;cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;
}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.tab:hover:not(.active){color:var(--txt2);}
.tab-content{display:none;}
.tab-content.active{display:block;}

/* ── MOD BODY ── */
.mod-body{max-width:860px;margin:0 auto;padding:32px 24px 40px;}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:28px;}
@media(min-width:500px){.stats-grid{grid-template-columns:repeat(4,1fr);}}
.stat-card{
  background:var(--bg);border:1px solid var(--border);
  padding:18px 14px;border-radius:var(--r);text-align:center;
}
.stat-val{font-family:'Fraunces',serif;font-size:22px;font-weight:900;margin-bottom:6px;line-height:1.2;}
.stat-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;}

/* ── INTRO TEXT ── */
.intro-text{font-size:16.5px;color:var(--txt2);line-height:1.9;margin-bottom:28px;}
.section-label{
  font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--muted);margin-bottom:16px;
}

/* ── FLOW DIAGRAM ── */
.flow-diagram{margin:0 0 28px;padding:22px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.flow-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}
.flow-row{display:flex;align-items:stretch;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.flow-row::-webkit-scrollbar{display:none;}
.flow-item{flex:1;min-width:90px;}
.flow-box{padding:14px 10px;text-align:center;border-radius:var(--r-sm);font-size:12px;font-weight:700;line-height:1.3;}
.flow-box small{display:block;font-size:10px;font-weight:400;margin-top:4px;opacity:0.7;}
.flow-sep{display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);padding:0 6px;flex-shrink:0;}

/* ── CALLOUTS ── */
.callout{padding:16px 20px;border-radius:var(--r-sm);font-size:14px;line-height:1.7;margin:20px 0;}
.callout strong{display:block;margin-bottom:4px;font-size:13px;}
.callout-gold{background:var(--gold-light);border-left:3px solid var(--gold-btn);color:var(--txt2);}
.callout-gold strong{color:var(--gold);}
.callout-green{background:var(--green-light);border-left:3px solid var(--green);color:var(--txt2);}
.callout-green strong{color:var(--green);}

/* ── ACTION LIST ── */
.action-list{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}
.action-item{
  display:flex;gap:14px;align-items:flex-start;
  padding:14px 18px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);box-shadow:var(--shadow-xs);
}
.action-num{
  width:28px;height:28px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#fff;
  background:var(--gold-btn);margin-top:1px;
}
.action-text{font-size:15px;color:var(--txt2);line-height:1.72;flex:1;}

/* ── LESSON ACCORDION ── */
.lesson-item{
  border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:8px;background:var(--surface);overflow:hidden;
  transition:border-color .2s,box-shadow .2s;box-shadow:var(--shadow-xs);
}
.lesson-item:hover{border-color:var(--gold-border);}
.lesson-item.open{border-color:var(--gold-btn);box-shadow:0 0 0 3px rgba(245,158,11,0.08);}
.lesson-head{
  display:flex;align-items:center;gap:14px;
  padding:16px 20px;cursor:pointer;transition:background .15s;user-select:none;
}
.lesson-head:hover{background:var(--bg);}
.lesson-idx{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;font-weight:700;flex-shrink:0;min-width:24px;
}
.lesson-name{font-size:15px;font-weight:600;color:var(--txt);flex:1;line-height:1.35;}
.lesson-arrow{font-size:14px;color:var(--muted);flex-shrink:0;transition:transform .25s;}
.lesson-item.open .lesson-arrow{transform:rotate(180deg);}
.lesson-body{display:none;border-top:1px solid var(--border2);}
.lesson-item.open .lesson-body{display:block;}
.lesson-inner{padding:20px 22px 22px;}
.lesson-intro-box{
  background:var(--gold-light);border-radius:var(--r-sm);
  padding:16px 18px;margin-bottom:20px;
  border-left:3px solid var(--gold-btn);
}
.lesson-intro-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.lesson-text{font-size:16px;color:var(--txt2);line-height:1.9;}
.lesson-pts-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.lesson-points{list-style:none;display:flex;flex-direction:column;gap:10px;}
.lesson-points li{display:flex;gap:14px;align-items:flex-start;}
.lesson-pt-num{
  width:24px;height:24px;border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#fff;
  margin-top:2px;
}
.lesson-pt-text{font-size:15px;color:var(--txt2);line-height:1.82;flex:1;}
.lesson-footer-bar{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:16px;padding-top:14px;border-top:1px solid var(--border2);
}
.lesson-read-time{font-size:12px;color:var(--muted);font-weight:500;}
.lesson-complete-check{font-size:12px;font-weight:700;color:var(--green);}

/* ── TOOLS ── */
.tool-setup-card{
  border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:8px;background:var(--surface);overflow:hidden;
  transition:border-color .2s;box-shadow:var(--shadow-xs);
}
.tool-setup-card.ts-open{border-color:var(--gold-btn);}
.tool-setup-head{
  display:flex;align-items:center;gap:12px;padding:14px 18px;
  cursor:pointer;transition:background .15s;
}
.tool-setup-head:hover{background:var(--bg);}
.tool-icon{font-size:18px;flex-shrink:0;}
.tool-name{font-size:14px;font-weight:700;color:var(--txt);flex:1;}
.tool-cat{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:20px;flex-shrink:0;}
.tool-cost{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;flex-shrink:0;}
.cost-free{background:var(--green-light);color:var(--green);}
.cost-paid{background:var(--blue-light);color:var(--blue);}
.tool-arrow{font-size:13px;color:var(--muted);transition:transform .25s;flex-shrink:0;}
.tool-setup-card.ts-open .tool-arrow{transform:rotate(180deg);}
.tool-body{display:none;border-top:1px solid var(--border2);}
.tool-setup-card.ts-open .tool-body{display:block;}
.tool-inner,.tool-body-wrap{padding:16px 20px 20px;}
.setup-step{
  display:flex;gap:12px;align-items:flex-start;
  padding:10px 0;border-bottom:1px solid var(--border2);
}
.setup-step:last-child{border-bottom:none;}
.step-num{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;flex-shrink:0;min-width:20px;margin-top:2px;color:var(--gold);}
.step-text{font-size:14.5px;color:var(--txt2);line-height:1.78;flex:1;}
.step-text strong{color:var(--txt);font-weight:600;}
.tools-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.tool-chip{
  background:var(--bg);border:1px solid var(--border);
  color:var(--txt2);font-size:13px;font-weight:500;
  padding:7px 14px;border-radius:20px;
}

/* ── VIDEO CARDS ── */
.video-grid{display:flex;flex-direction:column;gap:10px;}
.video-card-new{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;cursor:pointer;
  transition:all .2s;display:flex;box-shadow:var(--shadow-xs);
}
.video-card-new:hover{border-color:var(--gold-border);transform:translateY(-2px);box-shadow:var(--shadow);}
.video-thumb-new{
  width:140px;min-width:140px;height:100px;
  background:var(--bg2);background-size:cover;background-position:center;
  position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.search-thumb{background:linear-gradient(135deg,#FEF3C7,#FDE68A);}
.video-play-btn{
  width:42px;height:42px;background:rgba(255,255,255,0.95);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:16px;box-shadow:0 4px 16px rgba(0,0,0,0.2);
  transition:transform .2s;padding-left:3px;
}
.video-card-new:hover .video-play-btn{transform:scale(1.1);}
.search-play{padding-left:0;font-size:18px;}
.video-info{padding:12px 16px;display:flex;flex-direction:column;justify-content:center;}
.video-channel{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;}
.video-title{font-size:14px;font-weight:600;color:var(--txt);line-height:1.4;margin-bottom:8px;}
.video-badge{
  display:inline-block;font-size:10px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;
  padding:3px 10px;border-radius:20px;
  background:var(--gold-light);color:var(--gold);
  border:1px solid var(--gold-border);width:fit-content;
}
.search-badge{background:var(--blue-light);color:var(--blue);border-color:rgba(37,99,235,0.2);}

/* ── VIDEO MODAL ── */
.video-modal{
  position:fixed;inset:0;z-index:99999;
  background:rgba(28,25,23,0.85);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px;backdrop-filter:blur(10px);
}
.video-modal.hidden{display:none;}
.video-modal-inner{
  background:var(--txt);border-radius:var(--r);overflow:hidden;
  width:100%;max-width:840px;
  box-shadow:0 32px 80px rgba(0,0,0,0.5);
}
.video-modal-header{
  background:var(--surface);padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--border);
}
.video-modal-title{font-size:13px;font-weight:600;color:var(--txt);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.video-modal-close{
  width:32px;height:32px;background:var(--bg);
  border:1px solid var(--border);border-radius:50%;color:var(--txt2);font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .2s;
}
.video-modal-close:hover{background:var(--rose-light);color:var(--rose);border-color:transparent;}
.video-modal-frame{position:relative;padding-bottom:56.25%;height:0;background:#000;}
.video-modal-frame iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}
.video-search-body{padding:32px;text-align:center;}
.video-search-body p{font-size:15px;color:var(--txt2);margin-bottom:20px;line-height:1.6;}
.video-search-link{
  display:inline-block;background:linear-gradient(135deg,#F59E0B,#D97706);
  color:#fff;font-weight:800;font-size:14px;
  padding:13px 30px;border-radius:var(--r-sm);
  text-decoration:none;transition:all .2s;
}
.video-search-link:hover{transform:translateY(-1px);}

/* ── CONTENT BLOCKS ── */
.outcomes-block{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:22px 24px;margin-bottom:24px;
  box-shadow:var(--shadow-xs);
}
.outcomes-title{font-family:'Fraunces',serif;font-size:16px;font-weight:800;color:var(--txt);margin-bottom:16px;}
.outcomes-list{display:flex;flex-direction:column;gap:12px;}
.outcome-item{display:flex;gap:14px;align-items:flex-start;}
.outcome-num{
  width:26px;height:26px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#fff;
  flex-shrink:0;margin-top:2px;
}
.outcome-text{font-size:15px;color:var(--txt2);line-height:1.75;flex:1;}
.reality-block{
  background:var(--gold-light);border:1px solid var(--gold-border);
  border-radius:var(--r);padding:18px 20px;margin-bottom:24px;
  display:flex;gap:14px;align-items:flex-start;
}
.reality-icon{font-size:22px;flex-shrink:0;}
.reality-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
.reality-text{font-size:15px;color:var(--txt2);line-height:1.8;}
.case-study-block{
  background:var(--green-light);border:1px solid var(--green-border);
  border-left:3px solid var(--green);
  border-radius:var(--r);padding:18px 20px;margin-bottom:24px;
}
.case-study-label{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
.case-study-title{font-family:'Fraunces',serif;font-size:15px;font-weight:700;color:var(--txt);margin-bottom:8px;}
.case-study-text{font-size:15px;color:var(--txt2);line-height:1.8;}
.case-study-result{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--green-light);border:1px solid var(--green-border);
  color:var(--green);font-size:12px;font-weight:700;
  padding:5px 12px;border-radius:20px;margin-top:12px;
}

/* ── COMPLETE BTN ── */
.complete-btn{
  width:100%;padding:16px;
  background:linear-gradient(135deg,#F59E0B,#D97706);
  color:#fff;font-weight:800;font-size:15px;
  border:none;border-radius:var(--r-sm);cursor:pointer;
  margin-top:28px;box-shadow:0 4px 16px rgba(217,119,6,0.3);transition:all .2s;
}
.complete-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(217,119,6,0.4);}

/* ── MOD NAV ── */
.mod-nav{display:flex;gap:10px;margin-top:28px;padding-top:24px;border-top:1px solid var(--border2);}
.mod-nav-btn{
  flex:1;padding:13px 16px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);cursor:pointer;
  font-size:13px;font-weight:600;color:var(--txt2);
  text-align:left;transition:all .2s;box-shadow:var(--shadow-xs);
}
.mod-nav-btn:hover{border-color:var(--gold-btn);color:var(--txt);}
.mod-nav-btn.next-btn{text-align:right;}
.mod-nav-btn small{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:500;}

/* ── SITE FOOTER ── */
.site-footer{
  text-align:center;padding:28px 24px 32px;
  font-size:12px;color:var(--muted);
  border-top:1px solid var(--border);letter-spacing:.5px;
}

/* ── FOOTER DISCLAIMER ── */
.footer-disclaimer{
  max-width:800px;margin:0 auto;padding:24px 24px 0;
  font-size:12px;color:var(--muted);line-height:1.75;text-align:center;
  border-top:1px solid var(--border2);
}
.footer-disclaimer strong{color:var(--txt2);}

/* ── DISCLAIMER BANNER ── */
.disclaimer-banner{
  background:var(--gold-light);border-bottom:1px solid var(--gold-border);
  padding:10px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  flex-wrap:wrap;
}
.disclaimer-banner-text{font-size:13px;color:var(--txt2);line-height:1.5;flex:1;min-width:200px;}
.disclaimer-banner-text strong{color:var(--gold);font-weight:700;}
.disclaimer-badge{
  font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:#fff;background:var(--gold-btn);
  padding:4px 12px;border-radius:20px;white-space:nowrap;flex-shrink:0;
}
.disclaimer-close{
  background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;
  padding:0 4px;line-height:1;flex-shrink:0;transition:color .15s;
}
.disclaimer-close:hover{color:var(--txt);}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--txt);color:#fff;
  font-size:13px;font-weight:600;padding:11px 22px;
  border-radius:30px;opacity:0;transition:all .3s;
  pointer-events:none;z-index:9999;white-space:nowrap;
  box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .hamburger{display:flex;}
  .nav-link{display:none;}
  .hero h1{font-size:30px;}
  .hero-stats{gap:10px;}
  .hero-stat{padding:14px 10px;}
  .hero-stat strong{font-size:22px;}
  .mod-body{padding:20px 16px 28px;}
  .lesson-inner{padding:14px 16px 16px;}
  .video-thumb-new{width:100px;min-width:100px;}
  .selar-banner{flex-direction:column;align-items:flex-start;}
  .gate-top,.gate-bottom{padding-left:24px;padding-right:24px;}
}

/* ══════════════════════════════════════════════════════════
   PROGRESS PANEL
══════════════════════════════════════════════════════════ */
.pm-overlay{position:fixed;inset:0;z-index:5000;background:rgba(28,25,23,0.6);backdrop-filter:blur(6px);display:none;}
.pm-overlay.open{display:block;}
.pm-panel{
  position:fixed;top:0;right:0;bottom:0;z-index:5001;
  width:min(440px,100vw);background:var(--surface);
  box-shadow:-8px 0 48px rgba(0,0,0,0.18);
  display:flex;flex-direction:column;
  transform:translateX(105%);
  transition:transform .35s cubic-bezier(.16,1,.3,1);
  overflow:hidden;
}
.pm-panel.open{transform:translateX(0);}
.pm-header{
  padding:18px 22px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  background:linear-gradient(135deg,#FEF3C7,#FDE68A);
}
.pm-title{font-family:'Fraunces',serif;font-size:19px;font-weight:900;color:var(--txt);}
.pm-close{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.08);border:none;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--txt2);transition:all .15s;flex-shrink:0;}
.pm-close:hover{background:rgba(225,29,72,0.1);color:var(--rose);}
.pm-body{flex:1;overflow-y:auto;padding:20px;}
.pm-donut-card{
  display:flex;align-items:flex-start;gap:18px;
  background:linear-gradient(135deg,#FEF3C7,#FDE68A);
  border-radius:var(--r);padding:18px;margin-bottom:18px;
  border:1px solid var(--gold-border);
}
.pm-donut{width:88px;height:88px;flex-shrink:0;}
.pm-donut svg{width:100%;height:100%;}
.pm-donut-info{flex:1;min-width:0;}
.pm-donut-pct{font-family:'Fraunces',serif;font-size:28px;font-weight:900;color:var(--txt);line-height:1;}
.pm-donut-sub{font-size:13px;color:#92400E;font-weight:600;margin-top:2px;}
.pm-msg{font-size:13px;color:#78350F;line-height:1.6;margin-top:10px;padding-top:10px;border-top:1px solid rgba(217,119,6,0.2);}
.pm-section-title{font-family:'Fraunces',serif;font-size:15px;font-weight:800;color:var(--txt);margin-bottom:12px;}
.pm-tier-table{width:100%;border-collapse:collapse;margin-bottom:22px;font-size:13px;}
.pm-tier-table thead tr{background:var(--bg2);}
.pm-tier-table thead th{padding:9px 12px;text-align:left;font-weight:700;color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;border-bottom:1px solid var(--border);}
.pm-tier-table tbody tr{border-bottom:1px solid var(--border2);transition:background .15s;}
.pm-tier-table tbody tr:hover{background:var(--bg);}
.pm-tier-table td{padding:10px 12px;vertical-align:middle;}
.pm-tier-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;}
.pm-tier-name{font-weight:600;color:var(--txt);display:flex;align-items:center;}
.pm-mini-bar-wrap{width:70px;height:7px;background:var(--border);border-radius:6px;overflow:hidden;display:inline-block;}
.pm-mini-bar{height:100%;border-radius:6px;transition:width .6s ease;}
.pm-tier-frac{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;}
.pm-mod-list{display:flex;flex-direction:column;gap:5px;}
.pm-mod-row{
  display:flex;align-items:center;gap:12px;padding:9px 14px;
  background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);
  cursor:pointer;transition:all .15s;
}
.pm-mod-row:hover{border-color:var(--gold-btn);background:var(--gold-light);}
.pm-mod-row.done{background:var(--green-light);border-color:var(--green-border);}
.pm-mod-num{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--muted);min-width:24px;}
.pm-mod-title-txt{font-size:13px;font-weight:600;color:var(--txt);flex:1;line-height:1.3;}
.pm-mod-status{font-size:11px;font-weight:700;flex-shrink:0;}
.pm-footer{padding:14px 20px;border-top:1px solid var(--border);flex-shrink:0;display:flex;gap:10px;background:var(--surface2);}
.pm-footer-btn{flex:1;padding:13px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--bg);font-size:13px;font-weight:700;color:var(--txt2);cursor:pointer;text-align:center;transition:all .15s;}
.pm-footer-btn:hover{border-color:var(--gold-btn);color:var(--gold);}
.pm-footer-btn.primary{background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;border-color:transparent;}
.pm-footer-btn.primary:hover{transform:translateY(-1px);}

/* ══════════════════════════════════════════════════════════
   VOICE READER — Full-screen music player
══════════════════════════════════════════════════════════ */
.vr-fab{
  position:fixed;bottom:96px;right:18px;z-index:800;
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,#F59E0B,#D97706);
  border:3px solid #fff;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  font-size:22px;box-shadow:0 4px 20px rgba(217,119,6,0.5);
  transition:all .2s;
}
.vr-fab.visible{display:flex;}
.vr-fab:hover{transform:scale(1.08);}
.vr-screen{
  position:fixed;inset:0;z-index:9100;
  background:linear-gradient(160deg,#1a1007 0%,#2d1f09 50%,#1a1007 100%);
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform .38s cubic-bezier(.16,1,.3,1);
  overflow:hidden;
}
.vr-screen.open{transform:translateY(0);}
.vr-screen-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 22px 10px;flex-shrink:0;
}
.vr-screen-back{
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,0.1);border:none;
  color:rgba(255,255,255,0.7);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.vr-screen-back:hover{background:rgba(255,255,255,0.2);color:#fff;}
.vr-screen-label{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,0.35);}
.vr-art-area{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:10px 28px 0;overflow:hidden;
}
.vr-art{
  width:140px;height:140px;border-radius:22px;
  background:linear-gradient(135deg,#F59E0B 0%,#92400E 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:58px;margin-bottom:18px;
  box-shadow:0 16px 48px rgba(217,119,6,0.45);
  flex-shrink:0;
}
.vr-module-name{
  font-family:'Fraunces',serif;font-size:16px;font-weight:900;
  color:#fff;text-align:center;margin-bottom:4px;line-height:1.3;
  max-width:100%;
}
.vr-sent-counter{font-size:11px;color:rgba(255,255,255,0.35);font-family:'JetBrains Mono',monospace;}
.vr-caption{
  margin:14px 22px 0;
  background:rgba(255,255,255,0.06);

{
  id:2,tier:1,title:"Digital Product Creation",
  tagline:"Create once. Sell forever. 95% profit margin with zero inventory",
  tag:"Scalable",img:"1561070791-36c11ba4d2f8",
  stats:[{l:"Startup Cost",v:"₦0-₦50k"},{l:"Income Potential",v:"₦30k-₦400k/mo"},{l:"First Income",v:"1-4 weeks"},{l:"Difficulty",v:"Beginner"}],
  flow:[{l:"Create Product",s:"Once, 1-4 weeks"},{l:"List on Platform",s:"Gumroad or Selar"},{l:"Drive Traffic",s:"SEO or Social"},{l:"Earn Passively",s:"95% margin"}],
  outcomes:[
    "Identify which of the 8 best-selling digital product categories fits your skills and audience",
    "Validate your product idea before building it so you never waste time on products nobody wants",
    "Create a complete digital product in one week using free tools you already have access to",
    "List on the right platform with pricing and copy that converts browsers into buyers",
    "Write a sales page that overcomes objections and drives purchases without a sales call",
    "Use the bundle strategy to increase your average order value without creating new products",
    "Build a product suite that generates income at multiple price points simultaneously"
  ],
  caseStudy:{
    title:"Tunde from Lagos: Notion Templates earning ₦180k/month passively",
    text:"Tunde, a project manager in Lagos, created 6 Notion dashboard templates for freelancers and small business owners. He spent 3 weeks building them using Notion's free plan, priced them at ₦5,000-₦15,000 each on Selar, and promoted them on Twitter and LinkedIn. After 4 months, his templates rank in Selar's search results and generate 20-35 sales per month with zero ongoing work. His most popular template — a client management dashboard — generates ₦8,000 each time it sells.",
    result:"₦180k/month passive from 6 templates, 3 platforms"
  },
  realityCheck:"Digital products have a slow start and a fast scale. Expect your first month to generate ₦0-₦10,000. By month 3 with consistent promotion, ₦50,000-₦100,000 is realistic. The income compounds as your product accumulates reviews and ranks in platform searches. One good product properly positioned can fund the creation of your entire product suite.",
  intro:"Digital products are the purest form of online income. You create an asset once — an ebook, template, course, Lightroom preset, Notion system, or spreadsheet — and sell it infinitely with zero additional effort or cost. Margins are often 90-95%. One good digital product can generate consistent monthly income for years with no customer service headaches, no shipping delays, and no supply chain issues.",
  lessons:[
    {t:"The 8 Best-Selling Digital Product Categories in 2025",
     text:"Not all digital products sell equally. These categories have the highest demand and lowest creation barriers going into 2025. The key differentiator between products that sell and products that sit unsold is specificity: the more precisely your product solves a specific problem for a specific person, the higher it converts and the more you can charge.",
     pts:["Templates: Canva templates, Notion dashboards, Excel spreadsheets, and resume templates. Some creators earn ₦500,000+ per month on Etsy selling just one type of template. The advantage: create once, duplicate infinitely, zero delivery cost.",
"Ebooks and Guides: a 30-page highly focused guide at $17 beats a 300-page general book at $3. Specific solutions command premium prices. The best-selling ebooks answer one urgent question completely and comprehensively.",
"Presets and Filters: Lightroom, Photoshop, and CapCut presets sell in packs for $10-$50 on Creative Market, Etsy, and Gumroad. Photographers and videographers buy presets constantly because they save hours of editing time.",
"Swipe Files and Research Packs: email templates, content calendars, 90-day caption packs, and ad copy swipe files. These sell because they save professionals their most valuable resource: time.",
"Courses and Mini-Courses: structured video or text lessons on a specific skill. Mini-courses priced at $27-$97 outperform large expensive courses for beginners because buyers can commit without significant risk.",
"Printables: planners, habit trackers, wall art, journaling sheets, and educational worksheets. Etsy's printable market generates millions in transactions daily with zero shipping costs and instant delivery.",
"Audio Products: meditation tracks, sound effects packs, music loops for content creators, and podcast intro music. Audio products on platforms like AudioJungle generate passive royalties for years.",
"Spreadsheet Tools: financial trackers, budget templates, content calendars, and project management sheets. Excel and Google Sheets tools are in constant demand from small business owners who cannot afford expensive software."]},
    {t:"Validate Your Product Before You Build It",
     text:"The biggest mistake digital product creators make is building in isolation. Always validate your concept before investing significant time. The fastest validation method is a presale: sell the product at a discount before it is built. If people pay you, the idea is validated. If nobody pays, you saved weeks of work.",
     pts:["Post on Twitter, Instagram or LinkedIn: 'I am creating [product]. Who would pay ₦[price] for this? Reply or DM me.' If 10+ people respond positively within 48 hours, build it. No response is your answer before you spend any time.",
"Presales with Selar or Gumroad take under 10 minutes to set up. List the product as a pre-order with a delivery date 3-4 weeks out. If 5-10 people pay, you have validated product-market fit and funded your creation time.",
"Check Etsy and Gumroad for similar products with high sales numbers. 1,000+ sales on a competitor's product confirms buyers exist in that niche. Competition in proven markets is a green light, not a warning sign.",
"Survey your audience with a 2-question poll: 'Do you struggle with [problem]?' and 'Would you pay ₦[price] for a complete solution?'. Even 20 responses give you enough signal to decide whether to build.",
"Run a paid test: create a simple sales page for the product (no product yet). Run ₦5,000 in Facebook or Instagram ads to your target audience. If you get 3+ email signups showing interest, the product has commercial viability.",
"Analyze search data: if people are actively searching for '[your topic] template' or '[your topic] checklist' on Google or Pinterest, they are signaling they would pay for your product. Search volume is the most reliable validation signal available."]},
    {t:"Platforms, Pricing, and the Launch Strategy That Works",
     text:"Where you sell determines how much you keep, how much traffic you get, and who your buyers are. Each platform serves a different type of product creator. The smartest creators list on multiple platforms simultaneously to maximize discovery and revenue.",
     pts:["Selar is the best starting platform for Nigerian creators: accepts local payments, pays directly to Nigerian bank accounts, allows affiliate programs for your products, and has a growing organic search audience. Perfect for any digital product.",
"Gumroad charges a 10% flat fee with some built-in discovery. Great for writers, creators, and any digital product. Accept payments internationally. Pay internationally via PayPal or Payoneer.",
"Etsy has a 6.5% transaction fee but provides massive built-in traffic for templates and printables. An Etsy listing that ranks organically can sell daily with zero additional promotion — the platform brings the buyers to you.",
"Pricing psychology: anchor high and offer value. A ₦15,000 product at 50% off for launch feels like a deal. A ₦7,500 product with no anchor feels average. Start higher than feels comfortable; you can always discount but you can never raise perceived value after setting expectations low.",
"The launch sequence that consistently works: pre-launch waitlist email to warm up your audience → soft launch to waitlist at 30% discount → public launch at full price → urgency close (last 48 hours) → post-launch re-engagement. This structure typically generates 60-70% of your first-month revenue in the first 7 days.",
"Bundle pricing multiplies revenue without creating new products. Three separate ₦5,000 products sold individually generate ₦5,000 per sale. Bundled as a ₦12,000 package, you earn 2.4x per transaction with the same buyer."]},
    {t:"Creating Your First Product in One Week: The Complete Process",
     text:"The best product is the one you finish and publish. Speed matters more than perfection for your first digital product. Here is the exact 7-day creation process that produces a sellable, professional product with tools you already have.",
     pts:["Day 1: Identify one specific pain point your target audience experiences regularly. Write down the problem in their exact words. The product title and positioning comes directly from how your buyer describes their own problem.",
"Day 2: Create a detailed outline covering everything a buyer would need to solve their problem. Think like a teacher, not a vendor. The more complete your solution, the more justified your price point.",
"Day 3-4: Build the product in Canva (for visual products), Notion (for dashboards and templates), or Google Docs (for guides and ebooks). Use clean design: 2-3 fonts maximum, consistent color palette, professional mockup images.",
"Day 5: Write your sales page. The structure: headline stating the outcome → the problem you solve → who this is for → what is included → social proof or testimonial → pricing → FAQ answering the top 3 objections → call to action.",
"Day 6: Upload to Selar or Gumroad. Write a keyword-rich title and description. Set a compelling cover image. Configure payment processing and automatic file delivery.",
"Day 7: Launch announcement to every channel you currently use: email list, social media, WhatsApp groups, and LinkedIn. Even with a small audience, a genuine launch announcement consistently generates your first sales.",
"Day 8 onwards: collect buyer feedback actively. Message buyers directly asking what they found most and least valuable. Use this feedback to improve the product and create the next one."]},
    {t:"Writing a Sales Page That Converts: The 8-Part Framework",
     text:"Your sales page is your 24/7 salesperson. It works while you sleep, on public holidays, and without asking for a commission. A well-written sales page can convert 3-8% of visitors into buyers. A poor one converts under 0.5%. The difference is structure, empathy, and specificity.",
     pts:["Headline: state the specific, measurable outcome the buyer gets. 'The Freelancer's Complete Client Management System' beats 'A Great Notion Template'. Your headline is the most important line you will write — test multiple versions.",
"The Problem: describe the pain your buyer feels in their own language. 'Spending hours every week chasing client updates instead of doing actual work' resonates. Generic problem descriptions get skipped. Specific ones stop scrollers.",
"The Solution: introduce your product as the bridge from their current pain to their desired outcome. Do not list features. Describe transformations. Not 'includes project tracking database' but 'see every project's status in 10 seconds without sending a single follow-up email'.",
"What's Included: concrete specifics with quantities and outcomes. Not 'email templates' but '12 email templates covering every scenario from onboarding to late payment, fully customizable in 5 minutes each'.",
"Social Proof: real results from real buyers carry more weight than any claim you make about yourself. Even one specific testimonial like 'I used this template to cut my admin time by 6 hours per week' is worth more than 5 paragraphs of generic praise.",
"Risk Reversal: a 30-day money-back guarantee removes the buyer's largest objection (what if it is not worth it?) at zero real cost to you. Products with clear guarantees consistently convert 20-35% higher than identical products without them.",
"Pricing Anchor: show your regular price crossed out and your current price next to it. Even if you have always sold at this price, the visual anchor creates perceived value.",
"FAQ Section: answer the 5 questions buyers would ask before purchasing. Each FAQ removes an objection without the buyer having to ask. Common FAQs: 'Do I need [specific tool] to use this?', 'Is this suitable for beginners?', 'How quickly will I see results?'"]},
    {t:"The Bundle Strategy: Multiply Revenue Without New Products",
     text:"The bundle strategy is one of the fastest ways to increase your monthly revenue without creating a single new product. You take existing products that complement each other and sell them together at a premium price that is lower than the sum of individual prices. Buyers get more value; you earn more per transaction.",
     pts:["The starter bundle: take your 2-3 best-performing low-ticket products and package them as a value bundle priced at 1.5-2x your highest individual product. Example: three ₦5,000 templates individually sold → ₦12,000 bundle. Conversion on bundles is typically higher because buyers perceive value immediately.",
"The ascending value ladder: create 3 tiers. Tier 1 (free or low-cost): a single template or checklist that demonstrates your quality. Tier 2 (mid-ticket): a bundle of your best products. Tier 3 (high-ticket): everything plus personalized setup support or a group Q&A call. Each tier converts buyers from the tier below.",
"Cross-sell at checkout: after a buyer purchases Product A, immediately offer Product B as a one-click add-on at a discounted price. Platforms like Gumroad and Selar support post-purchase offers. 15-25% of buyers purchase the add-on because purchase intent is highest immediately after completing a transaction.",
"Seasonal bundles generate urgency without discounting permanently. A 'End of Year Planning Bundle' or 'Business Launch Bundle' creates a reason to buy now without devaluing your products in the long term.",
"The Ultimate Vault strategy: create a growing collection that buyers pay once to access everything, including future products. Price it higher than any individual product but frame it as the best value. Each new product you add increases the vault's value and gives you a reason to re-market to your audience."]},
    {t:"From Single Product to Digital Product Empire",
     text:"A single product is a sale. A product empire is a business. The transition happens when you stop thinking about products individually and start thinking about your entire catalog as a system designed to serve buyers at every stage of their journey.",
     pts:["Map your buyer journey: what does your ideal customer need first, second, and third? A freelancer might need a client contract template first (₦3,000), then a complete client onboarding system (₦12,000), then a full freelance business toolkit (₦35,000). Each product is a natural next step.",
"Create products that reference each other. In your ₦3,000 contract template, mention and link to your client onboarding system. This turns every buyer into a prospect for your next product without any additional marketing spend.",
"Your email list is your product empire's engine. Every buyer should be automatically added to an email sequence that introduces your other products, shares case studies from buyers, and builds anticipation for upcoming products.",
"Track revenue per product, conversion rate per product, and customer lifetime value. Products with high traffic but low conversion need sales page rewrites. Products with low traffic but high conversion need more promotion. This data tells you where to invest your energy.",
"Partner with other digital product creators in complementary niches for cross-promotion. A Notion template creator and a freelance business course creator serve the same audience. A simple referral arrangement where each recommends the other's products doubles both of your audiences at zero cost."]
    }
  ],
  tools:[
{name:"Canva (Product Design)",icon:"🎨",cat:"Design Tool",catColor:"rgba(255,202,44,0.12)",catTxt:"#C8841A",cost:"Free / $13/mo",costType:"free",
   steps:[

    "Click <strong>Create a Design</strong> and search for your format: Instagram Post, Presentation, A4 Document, or Custom Size.",
    "Browse templates and click to customize. Change colors, fonts, and images from the left sidebar.",
    "To sell a Canva template: click <strong>Share &gt; Template link</strong>. Buyers click this link and duplicate the template into their own Canva account instantly.",
    "To export as a PDF (ebook or guide): click <strong>Share &gt; Download &gt; PDF Standard</strong>. Keep under 20MB for easy upload.",
    "For product mockups: search 'mockup' in Canva's template library. Drop your product screenshot into the mockup frame for a professional preview image.",
    "Save your brand colors and fonts in <strong>Brand Kit</strong> so every product you create has visual consistency."

  {name:"Selar",icon:"🛒",cat:"Nigerian Platform",catColor:"rgba(255,45,107,0.12)",catTxt:"#CC2255",cost:"Free (10% fee)",costType:"free",
   steps:[

    "Enable the <strong>Affiliate Program</strong> under Product Settings so others can promote your product for a commission — this adds a free marketing army.",
    "Share your product link on WhatsApp, Instagram, and Twitter. Selar handles payment (including local bank transfers), file delivery, and receipts automatically.",

    "Set up <strong>Upsells</strong> in your product settings: after someone buys, they see your next product. This is your most high-converting marketing touchpoint."

  {name:"Notion (Template Builder)",icon:"📓",cat:"Product Creator",catColor:"rgba(0,229,255,0.12)",catTxt:"#00B8CC",cost:"Free",costType:"free",

{
  id:3,tier:1,title:"Freelancing and Service Business",
  tagline:"Turn your existing skills into immediate income. No audience required.",
  tag:"Fastest to Income",img:"1522202176988-66273c2fd55f",
  stats:[{l:"Startup Cost",v:"₦0"},{l:"Income Potential",v:"₦100k-₦800k/mo"},{l:"First Income",v:"1-14 days"},{l:"Difficulty",v:"Beginner"}],
  flow:[{l:"Identify Skill",s:"What you already know"},{l:"Find Clients",s:"Outreach or platforms"},{l:"Deliver Work",s:"Professional quality"},{l:"Get Paid",s:"Then raise rates"}],
  outcomes:[
    "Identify exactly which of your current skills has the highest earning potential in the freelance market",
    "Position your service around outcomes instead of tasks so you can charge premium rates",
    "Write proposals that win consistently using the 5-part structure",
    "Find clients through both outbound outreach and inbound content within your first 2 weeks",
    "Structure client relationships for retention, referrals, and recurring income",
    "Negotiate rates professionally and raise them systematically as you deliver results",
    "Transition from solo freelancer to a productized service business that scales beyond your personal hours"
  ],
  caseStudy:{
    title:"Adaeze from Abuja: Graphic Design to ₦450k/month in 5 months",
    text:"Adaeze had 2 years of Canva and Illustrator experience from designing church flyers. She repositioned her service as 'Social Media Visual Identity for Nigerian Coaches and Consultants' with a fixed-price package: ₦75,000 for a 30-day content graphics kit. She sent 200 personalized LinkedIn messages over 4 weeks. Her first 2 clients came from the same LinkedIn DM campaign on week 2. By month 5, she had 6 active retainer clients generating ₦450,000 per month, and turned down work for the first time.",
    result:"₦450k/month retainer income from 6 design clients"
  },
  realityCheck:"Freelancing is the fastest path to income of any model in this program — your first payment can come within 48-72 hours of starting. But income is inconsistent in months 1-3. The professionals who build stable six-figure freelance incomes solve one problem: they stop trading time for money and start selling outcomes on retainers. The upgrade from hourly to retainer is the single biggest income jump in freelancing.",
  intro:"Freelancing is the fastest path to online income because you are selling skills you already have. Writers, designers, developers, video editors, virtual assistants, and consultants all operate in a global freelance market projected to exceed $450 billion by 2026. The key is not just the skill itself but knowing how to position it, price it correctly, and find clients who will pay premium rates for the results you deliver.",
  lessons:[
    {t:"The Most In-Demand Freelance Skills in 2025",
     text:"The highest-earning freelance skills share one trait: they produce measurable, visible results for clients. Always position every service in terms of the outcome it creates, not the task it involves. 'I edit YouTube videos' is a task. 'I produce YouTube videos that your audience watches 70% through on average' is an outcome.",
     pts:["Copywriting and Content Writing: ₦25,000-₦150,000 per article for quality B2B content, ₦200,000-₦2,000,000 for sales page copy. Businesses need content constantly and the best writers are always in demand.",
"Web Development and Design: ₦200,000-₦5,000,000 per project with recurring retainers for maintenance. Nigerian fintech and e-commerce companies are actively hiring freelance developers at competitive rates.",
"Video Editing: ₦20,000-₦500,000 per video depending on complexity and client type. YouTube creators, brands, and social media managers are perpetually looking for reliable editors.",
"Graphic Design (Brand + Social): ₦50,000-₦500,000 per project. Businesses launching or rebranding always need design work; social media management retainers keep designers employed monthly.",
"AI Prompt Engineering and Workflow Setup: setting up AI systems and automations for businesses earns ₦150,000-₦1,500,000 per project. Demand is growing exponentially as businesses realize they need help implementing AI tools they cannot figure out alone.",
"Paid Ads Management (Meta, Google): charge 10-15% of monthly ad spend as a management fee. One client spending ₦500,000 per month on ads earns you ₦50,000-₦75,000 per month in management fees alone.",
"Virtual Assistance (Premium): executive VAs who handle email management, scheduling, research, and project coordination for international clients earn $1,000-$3,000 per month working remotely from Nigeria."]},
    {t:"Pricing: The Framework for Charging What You Deserve",
     text:"The most common and damaging mistake new freelancers make is dramatically underpricing. Low prices signal low quality to clients. Clients who pay premium rates are generally more professional, more respectful, provide cleaner briefs, and give better feedback. Raising your prices often improves client quality simultaneously.",
     pts:["Charge based on value, not time. If your landing page generates ₦1,000,000 extra in client revenue, charging ₦20,000 for it is giving away the value you create. Price against the outcome: a page worth ₦1,000,000 should cost ₦50,000-₦150,000.",
"The positioning reframe: instead of 'I write blog posts at ₦10,000 each', say 'I create SEO content that ranks on Google and drives qualified traffic for 12-24 months after publication. My clients typically see 3-5x their investment in 6 months.' Now you are a strategic partner, not a typist.",
"Research market rates on Upwork for your skill level, then price 30% above the median. You can always negotiate down but you can never negotiate up after quoting low.",
"The 3-tier pricing model gives clients a choice and anchors them toward the middle. Tier 1: basic deliverable. Tier 2: comprehensive package (your target). Tier 3: premium with extras. Most clients choose Tier 2. Tier 3's existence makes Tier 2 feel like a deal.",
"Raise rates after every 3 successful projects. Document results from each project — testimonials, metrics, outcomes. This compounding evidence justifies every rate increase and the best clients respect the upward trajectory.",
"Never quote hourly if you can avoid it. Hourly pricing rewards you for being slow. Project-based or retainer pricing rewards you for being fast and efficient, which is exactly the incentive structure that makes you a better professional."]},
    {t:"Where to Find High-Paying Clients: Outbound and Inbound",
     text:"Client acquisition has two modes: outbound (you find them) and inbound (they find you). Outbound gets results in days. Inbound takes months to build but compounds over time. Serious freelancers use both simultaneously. The fastest clients come from outbound; the best clients come from inbound.",
     pts:["LinkedIn outbound: search for your ideal client's job title (Marketing Manager, Founder, CEO) in your target industry. Send a personalized connection request referencing something specific on their profile. After connecting, send one value-first message before any pitch. 10 messages per day yields 2-5 responses. 20 pitches to serious prospects yields 1-3 calls.",
"Cold email outreach: find businesses that need your service. Use Hunter.io (free tier) to find decision-maker email addresses. Send 20 personalized emails per day with one specific observation about their business and one concrete improvement you would make. Subject lines that work: 'Quick thought on [their company name]' or 'Your [website/social media] + one idea'.",
"Upwork and Fiverr: build your first portfolio and collect reviews. Apply to jobs with a 3-paragraph proposal: what you understood from their brief, one specific insight about their project, and why your exact background makes you the right choice. Generic proposals are ignored; specific ones win.",
"Content on LinkedIn is underrated for freelancers. Post 3 times per week sharing insights from your work. Each post puts you in front of 500-2,000 people without cold outreach. Clients DM you directly asking for your services. One viral post has launched multiple freelance careers.",
"Ask for referrals directly after every successful project: 'I really enjoyed this project. Do you know anyone else who could benefit from this?' Referred clients close at 3-5x the rate of cold outreach, pay faster, and complain less.",
"Partnering with complementary freelancers: a web developer who partners with a copywriter and a graphic designer creates a referral loop. When a client asks the developer for a copywriter, they send you. When your client needs a developer, you send them. This generates consistent warm leads at zero cost."]},
    {t:"Writing Proposals That Win: The 5-Part Structure",
     text:"Most freelance proposals lose because they talk about the freelancer, not the client. The winning proposal structure reverses this: lead with your understanding of the client's situation, demonstrate relevant insight, then briefly introduce yourself. Clients hire people who understand their problem, not people who list their credentials.",
     pts:["Part 1 — Reflect the problem: start by demonstrating you read their brief carefully. 'From your post, it sounds like your primary challenge is [specific problem they described]. You need [specific outcome] without [specific constraint they mentioned].' This alone separates you from 90% of applicants who paste the same generic proposal.",
"Part 2 — One specific insight: share one concrete observation about their business that they have not thought of or a specific approach you would take. Example: 'I noticed your competitor [company name] is ranking for [keyword] that you are not targeting. My first two articles would focus there.' This demonstrates expertise, not just skill.",
"Part 3 — Relevant social proof: one specific result from a previous project. 'For [type of client], I recently delivered [specific outcome] in [timeframe].' If you have no previous work, use a personal project or a sample you created specifically for this proposal.",
"Part 4 — Clear scope and pricing: state exactly what you will deliver, in what timeframe, and at what price. Ambiguity causes anxiety and delays. Clarity creates confidence and accelerates decisions.",
"Part 5 — Low-friction next step: end with one clear action. 'Can we set up a 15-minute call this week so I can ask 3 questions before starting?' This is more effective than 'Let me know if you have questions' because it suggests a specific, simple action."]},
    {t:"Client Retention: Turning One-Time Projects into Monthly Income",
     text:"The most expensive thing in freelancing is acquiring new clients. The most profitable thing is keeping existing clients. A client who pays you ₦100,000 once is valuable. A client who pays you ₦100,000 per month for 12 months is a business. Retention is the skill that separates inconsistent freelancers from six-figure service businesses.",
     pts:["Deliver results that are slightly better than what you promised. Under-promise and over-deliver is not a cliché — it is a business strategy. If you promised 3 articles and you deliver 4, that client never considers looking for another writer.",
"Monthly retainer structure: identify what ongoing work your client could benefit from and price it as a fixed monthly package. A web developer becomes a 'Maintenance and Optimization Retainer' at ₦75,000/month. A content writer becomes a '4-article monthly content package' at ₦80,000/month. Retainers provide predictable income; clients appreciate predictable costs.",
"Proactive communication beats reactive communication every time. Send a brief weekly update (3 sentences maximum) showing progress even if nothing extraordinary has happened. Silence creates anxiety; updates create confidence.",
"Identify upsell opportunities within existing projects. A client who hired you to write website copy needs social media captions for that website. A client who hired you for logo design needs business card design. Present these as natural next steps, not sales pitches.",
"The 90-day review: schedule a brief quarterly check-in call with retainer clients. Ask: what is working well, what could be better, and what new challenges are they facing? These conversations consistently reveal new projects. Clients who feel heard rarely leave."]},
    {t:"From Freelancer to Agency: Scaling Beyond Your Personal Hours",
     text:"Solo freelancing has a ceiling: 24 hours per day, your personal energy, and the fact that your business stops when you stop. Crossing into agency territory means building systems that allow other people to deliver your service under your quality standard. The transition from ₦300,000/month to ₦1,000,000/month almost always involves this step.",
     pts:["Productize your service before hiring anyone. A productized service has a fixed scope, fixed price, fixed process, and fixed outcome. 'Custom design projects' cannot scale. 'Monthly Social Media Kit: 30 graphics, 10 caption templates, 1 banner design' for ₦75,000/month is a product that can be systematized.",
"Document your delivery process as a Standard Operating Procedure (SOP) before hiring a contractor. An SOP is a step-by-step guide for completing your service. If you cannot explain your process clearly enough for a trained contractor to follow it, you cannot delegate it.",
"Your first contractor should handle delivery, not client communication. You remain the client-facing professional. The contractor does the production work at 40-50% of what you charge. Your role becomes quality control and relationship management.",
"Price your productized services 20-40% higher than your solo rate to account for oversight time and quality control. Clients pay for the outcome and your reputation, not for knowing specifically who does the work.",
"The agency flywheel: one good contractor allows you to take on one more client. That extra income funds the second contractor. Two contractors allow you to take on 4 clients. At 5 contractors, you are running a genuine agency earning ₦2,000,000+ per month from services you no longer personally deliver."
      ]
    },
    {t:"The Rate Negotiation Playbook",
     text:"Negotiation is a skill, not a personality trait. Most freelancers lose thousands in monthly income not because their rates are too high but because they do not know how to hold their position when clients push back. The professional response to rate pushback is not to lower your price — it is to adjust the scope.",
     pts:["When a client says 'your rate is too high', do not immediately discount. Instead say: 'I completely understand budget is important. Which part of this package is most critical to your goals? I can adjust the scope to meet your budget rather than reduce the quality of what I deliver.'",
"Silence is a negotiation tool. After stating your price, stop talking. The first person to speak after a price is quoted is usually the one who compromises. Many freelancers discount themselves when the client simply paused to think.",
"The pause and hold technique: when you receive a pushback, say 'Let me look at that' and respond in 24 hours. This removes the emotional pressure of real-time negotiation, signals that you have other options, and gives you time to prepare a considered response.",
"Your best negotiation position comes from having multiple prospects. When you genuinely have 3 qualified leads, walking away from one low-paying offer is easy. Desperation is audible on calls and visible in email tone. Build your pipeline so you never negotiate from fear.",
"Know your walk-away rate before every negotiation. The rate below which you will not work for this client on this project. Not having a clear floor means you can be talked into unprofitable work. Your walk-away rate should increase every 6 months as your skills and reputation grow."
      ]
    }
  ],
  tools:[
  {name:"Upwork",icon:"💼",cat:"Find Clients",catColor:"rgba(0,240,134,0.12)",catTxt:"#00C070",cost:"Free (20% fee)",costType:"free",
   steps:[
    "Go to <strong>upwork.com</strong> and click Sign Up as a Freelancer.",
    "Upload a clear professional photo. Write a headline that includes your skill and your target client type: <em>Video Editor for YouTube Creators and Brands</em>.",
    "Write your Overview starting with the client's problem, not your background. Example: 'When you publish a video that loses viewers in the first 30 seconds, all your filming effort goes to waste. I edit YouTube videos specifically for retention and click-through rate.'",
    "Set your hourly rate 20% above your actual target. You can negotiate down; you cannot negotiate up.",
    "Add 3-5 portfolio samples. If you lack real client work, create samples specifically for your Upwork profile.",
    "When applying to jobs, reference 2-3 specific details from the job post. Generic proposals are rejected instantly.",
    "Goal for your first 30 days: 5 five-star reviews. Accept slightly lower rates for your first 5 projects to build your reputation, then raise rates permanently."
   ]},
  {name:"Notion (Portfolio + CRM)",icon:"📓",cat:"Free CRM",catColor:"rgba(0,229,255,0.12)",catTxt:"#00B8CC",cost:"Free",costType:"free",
   steps:[
    "Go to <strong>notion.so</strong> and create a free account.",
    "Create a page called Client Database with a table containing: Client Name, Project, Status, Rate, Next Action, Deadline.",
    "Create a Portfolio page with sections for each completed project: the brief, your approach, the result (specific metrics if possible), and a screenshot or link.",
    "Set up a simple CRM: track every prospect from First Contact → Proposal Sent → Call Scheduled → Proposal Accepted → Project Complete → Referral Requested.",
    "Create an Invoicing Log tracking invoice number, client, amount, date sent, and date paid. This prevents every freelancer's nightmare: forgotten unpaid invoices.",
    "Add a Testimonials section. After every successful project, copy the client's exact words of praise here. Use these on your proposals and social media.",
    "Share your portfolio page publicly with share → Publish to Web. Paste the link in your email signature and social media profiles."
   ]},
  {name:"Carrd (Portfolio Site)",icon:"🌐",cat:"Portfolio",catColor:"rgba(255,202,44,0.12)",catTxt:"#C8841A",cost:"Free / $19/yr",costType:"free",
   steps:[
    "Go to <strong>carrd.co</strong> and click Start Building. Choose a minimal one-page template.",
    "Your portfolio site needs exactly 4 sections: Who you are and who you help, Your specific service and what makes it different, 3 portfolio samples with results, and your contact form or booking link.",
    "Add a clear headline at the top: 'I help [target client] achieve [specific outcome] through [your service].' Example: 'I help Nigerian coaches get 10,000+ social media followers using custom-designed content graphics.'",
    "For portfolio samples: show before and after where possible. Metrics beat opinions — '23% engagement increase' is more convincing than 'great results'.",
    "On the free plan, your site will be at carrd.co/yourname. For $19/year (Pro), connect your own domain. A custom domain adds significant credibility.",
    "Add a Calendly booking link so prospects can schedule a call without email back-and-forth. Removing friction from the booking process consistently increases call rates."
   ]},
  {name:"Hunter.io (Cold Email)",icon:"📧",cat:"Outreach",catColor:"rgba(255,45,107,0.12)",catTxt:"#CC2255",cost:"Free (50/mo)",costType:"free",
   steps:[
    "Go to <strong>hunter.io</strong> and create a free account (50 searches/month free).",
    "Go to <strong>Domain Search</strong>. Enter a company's website URL (e.g. thecompany.com). Hunter finds email patterns and individual email addresses associated with that domain.",
    "Use <strong>Email Finder</strong> to find a specific person's email: enter their name and company domain. Hunter generates the most probable email with a confidence score.",
    "Use <strong>Email Verifier</strong> to verify any email address before sending. Sending to invalid addresses harms your deliverability.",
    "Go to <strong>Campaigns</strong> to send personalized cold email sequences directly from Hunter. Set up automated follow-up emails (day 3 and day 7) to non-responders.",
    "Write your outreach email: 3 paragraphs maximum. Line 1: a specific observation about their business. Line 2: one concrete improvement you would make. Line 3: a single low-friction question to open a conversation."
